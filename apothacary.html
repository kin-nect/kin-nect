<!DOCTYPE html>

<title>The Apothecary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0d0a06;color:#e8dcc8;font-family:Georgia,serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0d0a06}::-webkit-scrollbar-thumb{background:#3a3020;border-radius:3px}
button{cursor:pointer;font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}
.hdr-label{font-family:monospace;font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;color:#c8732a;margin-bottom:0.5rem}
.hdr-title{font-size:2.6rem;font-weight:400;color:#e8dcc8;margin-bottom:0.5rem}
.hdr-title em{color:#c8732a;font-style:italic}
.hdr-sub{font-size:1.2rem;color:#c8b890;font-style:italic;letter-spacing:0.03em;margin-bottom:2rem}
.boards{display:grid;grid-template-columns:repeat(5,1fr);gap:0.5rem;margin-bottom:0.75rem}
.board-btn{padding:0.85rem 0.75rem;background:rgba(255,255,255,0.02);border:1px solid rgba(232,220,200,0.1);border-radius:6px;color:#a09080;font-size:1rem;text-align:center;transition:all 0.15s}
.board-btn.active{background:rgba(200,115,42,0.12);border-color:rgba(200,115,42,0.5);color:#c8732a}
.board-desc{padding:0.75rem 1rem;background:rgba(200,115,42,0.04);border:1px solid rgba(200,115,42,0.08);border-radius:6px;margin-bottom:1.5rem;font-style:italic;font-size:1.05rem;color:#a09070;line-height:1.6}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.filter-btn{padding:5px 14px;border:1px solid rgba(232,184,75,0.1);border-radius:2rem;background:transparent;color:#5a4a3a;font-size:0.95rem;transition:all 0.15s}
.filter-btn.active{color:#e8dcc8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:1rem}
.card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:1.25rem;cursor:pointer;transition:all 0.2s;position:relative}
.card:hover{transform:translateY(-2px)}
.card-dot{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;opacity:0.7}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-family:monospace;font-size:0.62rem;letter-spacing:0.04em;padding:2px 6px;border-radius:2px}
.badge-fire{background:rgba(200,80,30,0.15);color:#d4733a;border:1px solid rgba(200,80,30,0.3)}
.badge-ital{background:rgba(58,138,74,0.15);color:#6aba8a;border:1px solid rgba(58,138,74,0.3)}
.card-emoji{font-size:1.8rem;display:block;margin-bottom:8px}
.card-name{font-size:0.95rem;color:#e8dcc8;margin-bottom:3px}
.card-tag{font-size:0.82rem;font-style:italic;margin-bottom:8px}
.card-tap{font-family:monospace;font-size:0.6rem;letter-spacing:0.1em;color:#6a5a4a;margin-top:6px}
.meta-tag{font-family:monospace;font-size:0.6rem;color:#5a4a3a;letter-spacing:0.06em;margin-bottom:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal-box{background:#131008;border-radius:6px;padding:2rem;max-width:540px;width:100%;max-height:82vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#5a4a3a;font-size:1.5rem;line-height:1}
.modal-emoji{font-size:2.5rem;display:block;margin-bottom:10px}
.modal-name{font-size:1.7rem;color:#e8dcc8;font-weight:400;margin:0 0 3px}
.modal-tagline{font-style:italic;font-size:0.9rem;margin:0 0 0.75rem}
.modal-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.modal-badge{font-family:monospace;font-size:0.6rem;letter-spacing:0.06em;padding:4px 10px;border-radius:3px}
.fire-box{background:rgba(200,80,30,0.08);border:1px solid rgba(200,80,30,0.25);border-radius:4px;padding:12px 14px;margin-bottom:1.25rem}
.fire-box-title{font-family:monospace;font-size:0.6rem;letter-spacing:0.12em;color:#d4733a;text-transform:uppercase;margin-bottom:6px}
.fire-box-text{font-size:0.9rem;color:#d4b090;line-height:1.6;margin-bottom:6px}
.fire-box-freq{font-family:monospace;font-size:0.6rem;letter-spacing:0.08em;color:#a06040}
.ital-box{border-left:3px solid;padding:10px 14px;border-radius:0 4px 4px 0;margin-bottom:1.25rem}
.ital-text{font-style:italic;font-size:0.88rem;color:#c8b890;line-height:1.6}
.modal-sec{font-family:monospace;font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;margin:0 0 8px}
.modal-list{list-style:none;padding:0;margin:0 0 1.25rem}
.modal-list li{font-size:0.88rem;color:#c8b890;padding:3px 0 3px 16px;position:relative;line-height:1.5}
.modal-list li::before{content:"*";position:absolute;left:0;color:#c8732a}
.modal-usage{font-size:0.88rem;color:#c8b890;line-height:1.7;margin:0 0 1.25rem}
.caution-box{background:rgba(180,50,30,0.08);border:1px solid rgba(180,50,30,0.2);border-radius:4px;padding:10px 12px}
.caution-text{font-size:0.82rem;color:#a06050;line-height:1.5}
@media(max-width:600px){.boards{grid-template-columns:repeat(2,1fr)}.hdr-title{font-size:2rem}}
</style>
</head>

  {n:"Ganja (Cannabis)",e:"",c:"sacred",col:"#2d5a27",t:"The Sacrament",trad:"Rastafarian - Vedic - Indigenous",b:["Sacred sacrament in Rastafari — used for meditation, prayer and reasoning","Referenced in the Vedas as one of five sacred plants","Pain relief and anti-inflammatory — medical cannabis well established","Reduces anxiety, PTSD and depression","Supports sleep and nervous system regulation","Anti-nausea — used during chemotherapy","Cannabinoids shown to have anti-tumour properties"],u:"Ceremonial: smoked with intention, in community or in meditation. Medicinal: CBD oil, tinctures, edibles — start low and slow. Understand your lineage with this plant before using.",i:"This plant has been criminalised to oppress the communities that hold it sacred. Know the history. Use with respect.",ca:"Legal status varies by country — know your jurisdiction. Not recommended for those with personal or family history of psychosis. Avoid during pregnancy."},
  {n:"Ceremonial Cacao",e:"",c:"heart",col:"#5a2d1a",t:"The Heart Opener",trad:"Mayan - Aztec - Central American",b:["Opens the heart centre — used ceremonially for emotional healing and connection","Contains theobromine — a gentle sustained energy lift without the anxiety of caffeine","MAO inhibitor — enhances mood and sense of wellbeing","Rich in magnesium, iron and antioxidants","Facilitates emotional release and deep inner work","Enhances creativity, presence and empathy"],u:"Ceremonial dose: 40-42g cacao block melted in hot water with chilli, cinnamon and a little sweetener. Set an intention. Sit with it. Can be used with meditation, journaling or movement.",i:"Not the same as chocolate. Ceremonial cacao is minimally processed, full-fat and used with intention. Source ethically — look for Guatemalan or Peruvian origin.",ca:"Avoid if on antidepressants (MAOIs) without guidance. High doses can cause nausea or racing heart in sensitive people."},
  {n:"Psilocybin Mushrooms",e:"",c:"vision",col:"#6a4a8a",t:"The Great Teacher",trad:"Mazatec - Mesoamerican - Global Indigenous",b:["Clinically proven to reduce treatment-resistant depression — Johns Hopkins and Imperial College research","Dissolves ego defensiveness — allows deep trauma processing","Reduces end-of-life anxiety in terminal patients","Creates lasting personality changes toward openness and empathy","Shown to reduce addiction — smoking, alcohol, opioids","Mystical experiences reported by most participants — long-term positive impact on wellbeing"],u:"Set and setting are everything. Micro-dosing: 0.1-0.3g for subtle cognitive and mood benefits. Ceremonial dose: 2-3.5g in a safe intentional space. Never alone for high doses. Integration after is as important as the journey.",i:"This medicine is having a clinical renaissance. What indigenous communities have known for millennia, science is now confirming.",ca:"Illegal in most countries — know your jurisdiction. Not suitable for those with personal or family history of psychosis or schizophrenia. Avoid mixing with lithium or SSRIs without guidance."}

var kitchen = [
  // ── DR. SEBI APPROVED FOODS ──
  {n:"Amaranth",e:"",c:"grain",col:"#c8732a",t:"The Ancient Grain",sebi:true,ital:true,form:"Grain - Flour - Porridge",b:["Dr. Sebi's approved grain — one of the oldest cultivated foods on Earth","Complete protein — contains all essential amino acids, rare for a grain","Rich in iron, calcium, magnesium and phosphorus","Gluten-free — easy on the digestive system","High in lysine — an amino acid most grains lack","Anti-inflammatory — reduces systemic inflammation"],u:"Cook like rice: 1 cup amaranth to 2 cups water, simmer 20 minutes. Use as porridge with agave and berries. Ground into flour for flatbreads. Puff by heating dry in a pan.",i:"Used by the Aztecs as a sacred food — Cortez banned it to break their power. You are reclaiming it every time you eat it.",ca:"Buy whole grain or flour only — avoid any amaranth products with additives or hybrid crossings."},
  {n:"Quinoa",e:"",c:"grain",col:"#b8a040",t:"The Complete Protein Seed",sebi:true,ital:true,form:"Grain - Flour - Salad",b:["Dr. Sebi approved — one of his few grain endorsements","Complete protein with all 9 essential amino acids","Rich in magnesium, iron, zinc, potassium and B vitamins","Gluten-free and alkaline-forming","High in antioxidants — quercetin and kaempferol","Feeds beneficial gut bacteria — acts as a prebiotic"],u:"Rinse thoroughly to remove saponins (the bitter coating). Cook 1 cup to 2 cups water for 15 minutes. Use as a rice replacement, in salads, or as a breakfast porridge with date sugar and fruit.",i:"Sacred to the Incas — called the mother of all grains. It is not a grain at all. It is a seed. That is why Dr. Sebi approved it.",ca:"Rinse well before cooking — unrinsed quinoa can taste bitter and may cause digestive discomfort."},
  {n:"Spelt",e:"",c:"grain",col:"#c8a060",t:"The Ancient Wheat",sebi:true,form:"Flour - Bread - Pasta",b:["Dr. Sebi approved alternative to hybrid modern wheat","Ancient grain — not crossbred like modern wheat varieties","Contains gluten but in a more digestible form than modern wheat","Rich in B vitamins, magnesium and zinc","Higher protein content than regular wheat","More alkaline-forming than modern wheat products"],u:"Use spelt flour for baking — bread, flatbreads, pancakes. Spelt pasta is widely available. Whole spelt berries can be cooked like rice and used in grain bowls.",i:"Before wheat was hybridised into the hard-to-digest thing it is today, spelt was the bread. Going back to spelt is going back to what the body recognises.",ca:"Still contains gluten — not suitable for coeliac disease. Those sensitive to modern wheat may tolerate spelt but test carefully."},
  {n:"Teff",e:"",c:"grain",col:"#8a6a30",t:"The Ethiopian Staple",sebi:true,ital:true,form:"Flour - Porridge - Injera",b:["Dr. Sebi approved grain — native to Ethiopia and Eritrea","Tiny grain, massive nutrition — calcium, iron, protein and fibre","Gluten-free and alkaline-forming","Rich in resistant starch — feeds good gut bacteria and regulates blood sugar","High in iron — essential for those not eating meat","Contains all 8 essential amino acids"],u:"As porridge: simmer 1 cup teff in 3 cups water for 15-20 minutes, add date sugar and fresh fruit. As injera: ferment teff flour with water for 2-3 days to make the spongy Ethiopian flatbread. Use teff flour for pancakes and baking.",i:"The grain that sustained some of the longest-living, hardest-working people on Earth. Ethiopian distance runners eat teff. That tells you everything.",ca:"Ensure you source pure teff — some commercial products mix with other flours."},
  {n:"Wild Rice",e:"",c:"grain",col:"#3a4a2a",t:"The Water Grass",sebi:true,ital:true,form:"Grain - Salad - Soup",b:["Dr. Sebi approved — technically a grass seed, not a true rice","More protein than any true rice variety","Rich in antioxidants — darker colour signals higher polyphenol content","Gluten-free and high in B vitamins","Lower glycaemic index than white or brown rice","Anti-inflammatory and supports heart health"],u:"Cook 1 cup wild rice in 3 cups water for 45-50 minutes until grains split open. Use in soups, salads, stuffed vegetables or alongside stews. Mix with quinoa for a grain bowl base.",i:"Harvested from the lakes of North America by indigenous peoples for thousands of years. It grows wild in water. That is why it carries the energy of living water.",ca:"Takes longer to cook than regular rice — do not undercook as it will be tough. Buy from a clean, traceable source."},
  {n:"Avocado",e:"",c:"fruit",col:"#3a6a2a",t:"The Healing Fat",sebi:true,ital:true,form:"Raw - Smoothie - Sauce",b:["Dr. Sebi approved — one of his highest recommended foods","Rich in oleic acid (the same fat as olive oil) — anti-inflammatory and heart-protective","Contains more potassium than a banana","Loaded with fibre, folate, vitamins K, C, B5 and B6","Monounsaturated fats help absorb fat-soluble nutrients from other vegetables","Alkaline-forming — raises the body's pH"],u:"Eat raw in salads, on spelt bread, as guacamole or blended into smoothies for creaminess without dairy. Dress with lime juice and sea salt. Use in place of butter on toast.",i:"Green, creamy, rich — the avocado is Jah's butter. It gives you the fat you need without what you do not.",ca:"Ripe only — unripe avocado can cause digestive discomfort. Latex allergy sufferers may react to avocado."},
  {n:"Coconut (Young)",e:"",c:"fruit",col:"#c8b060",t:"The Whole Food",sebi:true,ital:true,form:"Water - Flesh - Oil - Milk",b:["Every part of the coconut is medicine or food — nothing is wasted","Coconut water is a natural electrolyte drink — hydrates at a cellular level","Coconut flesh is rich in MCT fats — immediate energy that bypasses digestion","Coconut oil is antimicrobial — lauric acid kills viruses, bacteria and fungi","Coconut milk is the Ital replacement for all dairy","Alkaline-forming and deeply nourishing"],u:"Drink fresh coconut water straight from the coconut — it is sterile and mineral-rich. Use coconut oil for cooking at high heat (stable fat). Use coconut milk in stews, curries and porridge. Grate fresh flesh into dishes or blend into sauces.",i:"In Ital living, coconut replaces dairy completely. The milk of the earth, not the animal. Every part given freely by the tree.",ca:"Coconut oil is high in saturated fat — use in moderation if you have heart disease. Buy raw, cold-pressed virgin coconut oil only."},
  {n:"Mango",e:"",c:"fruit",col:"#f0a020",t:"The King of Fruit",sebi:true,ital:true,form:"Raw - Juice - Smoothie",b:["Dr. Sebi approved — one of the highest vibrational fruits","Rich in vitamins A, C, B6, folate and potassium","Digestive enzymes (amylases) that help break down other foods","Anti-inflammatory — quercetin and mangiferin fight chronic inflammation","Supports eye health — lutein and zeaxanthin protect the retina","Boosts immunity and alkalises the body"],u:"Eat fresh and ripe — never unripe. Blend into smoothies or juices. Dice into salads or salsas. Dry into mango slices as a snack. Use frozen mango in smoothies year-round.",i:"Sweet, golden and abundant — the mango is the sun in fruit form. In Ital living, sweetness from Jah's trees is the only sweetness you need.",ca:"Very high in natural sugar — eat in moderation if diabetic or managing blood sugar. Source naturally grown, non-GMO mangoes."},
  {n:"Figs",e:"",c:"fruit",col:"#8a3a6a",t:"The Sacred Fruit",sebi:true,ital:true,form:"Fresh - Dried - Tea",b:["Mentioned in the Quran, the Bible and the Vedas — one of the most sacred fruits on Earth","Dr. Sebi approved — deeply alkaline and mineral-rich","High in calcium — the best plant-based calcium source after sesame","Rich in iron, potassium and magnesium","Natural laxative — relieves constipation gently","High in antioxidants — protect against cancer and heart disease"],u:"Eat fresh when in season — the best way. Dried figs are available year-round and are a powerhouse snack. Soak dried figs overnight for smoother digestion. Steep dried figs in hot water as a mineral-rich drink.",i:"Jah Himself swore by the fig in scripture. This fruit carries millennia of sacred energy. It is not just food — it is covenant.",ca:"Dried figs are very high in sugar — eat in moderation. Ensure they are unsulphured (no sulphur dioxide preservative)."},
  {n:"Date Sugar",e:"",c:"sweetener",col:"#8a5020",t:"The Only Sweetener",sebi:true,ital:true,form:"Sugar - Syrup - Raw Dates",b:["Dr. Sebi's only approved sweetener alongside agave","Made from whole dried dates — retains fibre, minerals and nutrients","Lower glycaemic index than refined sugar — slower blood sugar rise","Rich in potassium, magnesium and B vitamins","Does not strip the body of minerals the way refined sugar does","Alkaline-forming — unlike all refined sugars which are acid-forming"],u:"Use 1:1 in place of sugar in any recipe. Works in porridge, smoothies, baked goods and drinks. Raw Medjool dates are even better — blend them into smoothies or eat as a sweetener in their whole form.",i:"Babylon's sugar destroys. Jah's sweetener nourishes. The date has been feeding civilisations for 8,000 years — there is wisdom in that longevity.",ca:"Still high in sugar — those managing blood sugar should use mindfully. Buy organic, unsulphured dates only."},
  {n:"Agave (Raw)",e:"",c:"sweetener",col:"#a0c060",t:"The Plant Nectar",sebi:true,form:"Nectar - Syrup",b:["Dr. Sebi's primary approved liquid sweetener","Lower glycaemic index than honey or refined sugar","Alkaline-forming — unlike most sweeteners","Contains inulin — a prebiotic that feeds beneficial gut bacteria","Neutral flavour — works in both sweet and savoury applications","Natural — extracted from the agave plant without chemical processing"],u:"Use in teas, smoothies and dressings. Use raw agave (not heated/processed) for maximum benefit. Use sparingly — sweeter than sugar so less is needed.",i:"The agave plant survives desert heat and produces nectar — sweetness born from strength and endurance. Raw agave is one of the cleanest sweeteners nature offers.",ca:"Buy raw, unprocessed agave only — processed agave is high in fructose and can strain the liver. Use in moderation regardless."},
  {n:"Olive Oil (Extra Virgin)",e:"",c:"oil",col:"#a0a040",t:"The Sacred Oil",sebi:true,ital:true,form:"Dressing - Cooking - Finishing",b:["Dr. Sebi approved cooking oil — his most recommended fat","Rich in oleic acid — the most anti-inflammatory fatty acid","Polyphenols protect the heart and reduce oxidative stress","Reduces LDL cholesterol and raises HDL (good) cholesterol","Anti-inflammatory — reduces systemic inflammation markers","Protects the brain — linked to reduced Alzheimer's risk"],u:"Use raw as a dressing and finishing oil — drizzle over salads, grains and cooked vegetables. Use for low-to-medium heat cooking only — high heat damages the beneficial compounds. Never deep fry with olive oil.",i:"Pressed from the fruit of a tree that can live for thousands of years. Olive oil carries the longevity of the tree that made it.",ca:"Buy cold-pressed extra virgin only — refined olive oil has no medicinal benefit. Avoid overheating — use coconut oil for high-heat cooking instead."},
  {n:"Hemp Seeds",e:"",c:"protein",col:"#7a8a3a",t:"The Complete Protein",sebi:true,ital:true,form:"Raw - Oil - Milk - Powder",b:["Dr. Sebi approved — one of the most complete foods on Earth","Complete protein — all 10 essential amino acids in ideal ratios","Perfect omega-3 to omega-6 ratio — 3:1, the ratio the human body needs","Rich in gamma-linolenic acid (GLA) — anti-inflammatory and hormone-balancing","High in magnesium, zinc, iron and B vitamins","Easy to digest — no antinutrients like lectins or phytates"],u:"Sprinkle raw hemp seeds on everything — salads, porridge, soups, smoothies. Blend into a hemp milk (4 tbsp seeds to 500ml water, blend and strain). Use hemp seed oil raw as a dressing — never heat it.",i:"The seed of the sacred plant, stripped of its medicine but full of nutrition. Hemp feeds every system of the body. It is whole in the way few things are.",ca:"Hemp seed oil goes rancid quickly — refrigerate and use within 6 weeks of opening. Do not heat hemp oil — destroys the omega-3 fatty acids."},
  {n:"Sesame Seeds (Tahini)",e:"",c:"protein",col:"#c8a860",t:"The Calcium King",sebi:true,ital:true,form:"Seeds - Tahini - Oil",b:["Highest plant-based calcium content of any food — higher than dairy by weight","Dr. Sebi approved protein and fat source","Rich in iron, zinc, magnesium, phosphorus and B vitamins","Sesamin and sesamolin — lignans with powerful anti-inflammatory and antioxidant effects","Supports healthy blood pressure","Tahini (ground sesame) is a complete protein source"],u:"Use tahini as a base for dressings, dips and sauces. Sprinkle sesame seeds on grains and salads. Blend tahini with lime, garlic and water for a dressing. Black sesame seeds have even higher antioxidant content than white.",i:"Tiny seed, enormous nourishment. Open sesame — the ancient phrase came from the sesame pod bursting open when ripe. It opens you too.",ca:"Sesame allergy is one of the major food allergens — be aware. Buy raw, unhulled tahini for maximum mineral content."},
  {n:"Ginger (Fresh)",e:"",c:"spice",col:"#c8a040",t:"The Warming Root",sebi:true,ital:true,form:"Tea - Food - Juice - Tonic",b:["Gingerol — the most powerful anti-inflammatory compound in the plant world","Relieves nausea, morning sickness and motion sickness clinically proven","Digestive fire — stimulates digestive enzymes and bile","Anti-cancer — shown to target cancer stem cells in research","Reduces blood sugar and improves insulin sensitivity","Immune boosting — antiviral and antibacterial"],u:"Morning tonic: slice fresh ginger into hot water with lemon and a pinch of cayenne. Grate into stir-fries, soups and curries. Cold-press for a ginger shot. Blend into smoothies. Use in marinades and dressings.",i:"Ginger does not whisper. It arrives, warms you from the inside, and gets to work. It is one of the most honest medicines the earth makes.",ca:"High doses may thin the blood — use cautiously before surgery. Can cause reflux in sensitive people if taken on an empty stomach. Avoid therapeutic doses in pregnancy."},
  {n:"Turmeric (Raw)",e:"",c:"spice",col:"#e0a020",t:"The Golden Healer",sebi:true,ital:true,form:"Root - Powder - Tea - Milk",b:["Curcumin — one of the most studied anti-inflammatory compounds in nature","Matches or outperforms ibuprofen for arthritis pain in clinical trials","Anti-cancer — curcumin is being researched for over 12 cancer types","Supports liver detoxification and bile production","Neuroprotective — crosses the blood-brain barrier, linked to Alzheimer's prevention","Antidepressant — boosts serotonin and dopamine naturally"],u:"Golden milk: warm coconut milk with 1 tsp turmeric, black pepper, ginger and date sugar. Add to rice, stews and curries. Juice raw turmeric root. Always combine with black pepper (piperine increases absorption by 2000%).",i:"The root that colours everything gold. In Ayurveda and Ital cooking, turmeric is not a spice — it is a daily medicine.",ca:"Do not take in high supplement doses without guidance — can affect bile duct in those with gallstones. Always pair with black pepper for absorption."},
  {n:"Cayenne Pepper",e:"",c:"spice",col:"#c83020",t:"The Circulatory Herb",sebi:true,ital:true,form:"Powder - Tonic - Food",b:["Capsaicin — stimulates circulation and warms every system of the body","Clears mucus from the respiratory and digestive tracts","Anti-inflammatory and analgesic — reduces pain when taken internally","Supports weight management — increases metabolism temporarily","Cardiovascular tonic — shown to reduce heart attack risk","Natural preservative — antimicrobial"],u:"Add a pinch to warm water with lemon and ginger as a morning tonic. Add to cooking at the end (heat reduces capsaicin). Use in dressings and marinades. Start small — build up your tolerance.",i:"Cayenne goes where circulation is weak and warms it back to life. It is the herb of fire — Dr. Sebi and Ital healers both used it to move what is stuck.",ca:"Start with very small amounts — too much causes stomach irritation. Avoid if you have active ulcers. Wash hands thoroughly after handling."},

  // ── ITAL STAPLES ──
  {n:"Ackee",e:"",c:"ital",col:"#e8c030",t:"The National Fruit",ital:true,form:"Cooked - Saltfish alternative",b:["National fruit of Jamaica — central to Ital cooking","Buttery, egg-like texture makes it the perfect plant-based protein","Rich in fatty acids, zinc and vitamin C","When cooked, provides a protein and fat profile similar to eggs","High in potassium and B vitamins","Used in ackee and callaloo as a full Ital breakfast"],u:"MUST be fully ripe and cooked — unripe ackee is toxic. Tinned ackee in brine is safe and widely available. Saute with onion, scotch bonnet, thyme and spring onion. Use as a topping on rice, with callaloo or in wraps.",i:"Ackee came to Jamaica on a slave ship from West Africa and became the soul of the island's food. It is Ital history on a plate.",ca:"NEVER eat unripe ackee — it contains hypoglycin A, which causes Jamaican Vomiting Sickness. Only eat when fully ripe and properly cooked. Tinned versions are safe."},
  {n:"Callaloo",e:"",c:"ital",col:"#2a6a2a",t:"The Iron Leaf",ital:true,form:"Cooked - Soup - Side",b:["Staple green of Caribbean Ital cooking — similar to spinach but more mineral-rich","Very high in iron — essential for those not eating meat","Rich in calcium, potassium, vitamins A, C and K","Anti-inflammatory and antioxidant","Supports bone health and immune function","Deeply alkaline — one of the most nutrient-dense greens available"],u:"Saute with garlic, onion, thyme, scotch bonnet and coconut oil. Cook down like spinach — it wilts significantly. Use in callaloo and ackee, callaloo soup, or as a side green with rice and peas. Add to stews in the last 10 minutes.",i:"Every Ital kitchen begins with callaloo. It is the first green, the foundation leaf, the iron in the blood of the cooking.",ca:"Callaloo is amaranth leaf in the Caribbean — ensure you are buying the correct plant. Those on blood thinners should be mindful of the high Vitamin K content."},
  {n:"Plantain",e:"",c:"ital",col:"#c8a020",t:"The Starchy Staple",ital:true,form:"Boiled - Fried - Baked - Porridge",b:["Staple carbohydrate of Ital and Caribbean cooking","Rich in complex carbohydrates — sustained energy without blood sugar spikes","High in potassium, vitamin C, vitamin B6 and magnesium","Resistant starch when green — feeds beneficial gut bacteria","Anti-inflammatory — reduces gut inflammation","Both sweet (ripe) and savoury (green) applications"],u:"Green plantain: boil, bake or fry in coconut oil for a savoury starchy side. Ripe plantain (yellow-black): fry in coconut oil for sweet plantain, or bake. Fully ripe: blend into smoothies or make porridge. Roast for a sweeter, caramelised result.",i:"Plantain is not banana. It is the carbohydrate that fed African and Caribbean people through generations. Versatile, filling and faithful.",ca:"Frying in too much oil makes them heavy — baking or boiling is the Ital way. Buy ripe for sweetness, green for savoury use."},
  {n:"Rice and Peas",e:"",c:"ital",col:"#7a8a5a",t:"The Ital Sunday Dish",ital:true,form:"Rice dish - Sunday meal",b:["Foundation dish of Jamaican Ital cooking — not a side, a meal","Kidney beans (gungo peas, red peas) provide complete protein when combined with rice","Coconut milk makes it dairy-free and rich","Thyme, scotch bonnet and spring onion are the holy trinity of Ital flavour","High in fibre, iron, plant protein and complex carbohydrates","Deeply satisfying and energising — built to sustain hard work"],u:"Soak kidney beans or gungo peas overnight. Cook in coconut milk with thyme, whole scotch bonnet, spring onion, garlic and sea salt. Add washed rice and cook until absorbed. The rice takes on the colour and flavour of everything in the pot.",i:"Rice and peas is not just food. It is Sunday. It is community. It is the table that everyone gathers around. In Ital living, food is always also communion.",ca:"Use dried beans soaked overnight for best results — tinned beans work but lose some nutrition. Remove scotch bonnet before serving if you do not want extreme heat."},
  {n:"Scotch Bonnet",e:"",c:"ital",col:"#e84020",t:"The Sacred Heat",ital:true,form:"Fresh - Dried - Sauce",b:["The defining flavour of Caribbean Ital cooking — irreplaceable","High in capsaicin — powerful anti-inflammatory and circulatory herb","One of the highest vitamin C contents of any food","Antimicrobial — kills harmful bacteria in food and the gut","Boosts metabolism and supports weight management","Anti-cancer — capsaicin shown to trigger apoptosis in cancer cells"],u:"Use whole in cooking for flavour without heat (remove before eating) or chopped for full fire. Never touch your eyes after handling. Add to rice and peas, soups, stews and callaloo. Make a scotch bonnet sauce with mango, vinegar and garlic.",i:"The scotch bonnet does not compromise. It is the full expression of heat — unapologetic, clarifying and alive. Ital cooking is not bland. It is vibrant.",ca:"Extremely hot — handle with care, wash hands thoroughly after. Start with whole pepper for flavour only. Those with stomach ulcers or IBS should use with caution."},
  {n:"Breadfruit",e:"",c:"ital",col:"#8a9a4a",t:"The Ital Bread",ital:true,form:"Roasted - Boiled - Fried - Chips",b:["One of the most abundant and sustainable starchy foods on Earth","Starchy carbohydrate and plant protein in one fruit","Rich in potassium, magnesium, calcium and B vitamins","Fibre-rich — supports gut health and sustained energy","Lower glycaemic index than bread or white rice","Deeply versatile — can replace bread, potato and pasta"],u:"Roast whole over an open flame or in the oven until skin blackens and flesh is tender — the best method. Boil and mash like potato. Fry into breadfruit chips. Slice and bake into a gratin with coconut milk.",i:"Captain Bligh brought breadfruit to the Caribbean to feed the enslaved. They transformed it into one of the most beloved Ital foods. Resistance through nourishment.",ca:"Must be cooked — raw breadfruit is indigestible. Buy from Caribbean, African or Asian grocers or markets."},
  {n:"Sea Moss Gel",e:"",c:"tonic",col:"#2d5a7a",t:"The Daily Foundation",sebi:true,ital:true,form:"Gel - Drink - Smoothie additive",b:["Contains 92 of the 102 minerals the human body is made of","The single most important daily supplement in Ital and Dr. Sebi tradition","Prebiotic — coats and strengthens the gut lining","Thyroid support — rich in natural iodine","Skin, hair and joint health from within","Natural thickener — replaces eggs and gelatine in cooking"],u:"Make your own: soak raw dried sea moss for 12-24 hours, blend with spring water until smooth gel forms. Store in the fridge for up to 3 weeks. Take 1-2 tablespoons daily in smoothies, juices or teas. Use as a cooking thickener.",i:"Every morning, before anything else. Sea moss gel is the foundation that everything else is built on in Ital living. Start here.",ca:"Source wildcrafted from clean waters — not pool-grown (pool-grown contains no minerals). Do not use if you have hyperthyroidism."},

  // ── RECIPES ──
  {n:"Ital Stew",e:"",c:"recipe",col:"#c87030",t:"The Foundation Meal",ital:true,form:"Recipe - Serves 4",b:["Completely plant-based — no meat, no dairy, no salt (use sea salt or herbs)","High in protein from kidney beans and lentils","Rich in iron, potassium and B vitamins","Warming and deeply nourishing — a complete meal in one pot","Can be adapted with whatever vegetables are in season","Scotch bonnet and thyme give authentic Caribbean depth of flavour"],u:"INGREDIENTS: 400g kidney beans (soaked overnight), 2 sweet potatoes diced, 2 carrots, 1 tin coconut milk, 1 scotch bonnet (whole), 4 sprigs thyme, 3 cloves garlic, 1 onion, spring onion. METHOD: Saute onion and garlic in coconut oil. Add all vegetables and beans. Pour in coconut milk and 500ml water. Add whole scotch bonnet and thyme. Simmer 45 minutes until thick and rich. Serve over wild rice or with boiled plantain.",i:"The Ital stew does not have a fixed recipe — it has principles. Whole food, plant-based, seasoned with herbs not chemicals, cooked with love. The rest is yours.",ca:"Ensure beans are fully cooked — undercooked kidney beans contain lectins that cause food poisoning. Soak overnight and boil vigorously for the first 10 minutes."},
  {n:"Golden Sea Moss Tonic",e:"",c:"recipe",col:"#d4a030",t:"Dr. Sebi Morning Tonic",sebi:true,ital:true,form:"Recipe - 1 serving",b:["Dr. Sebi approved ingredients throughout","Sea moss provides the 92-mineral foundation","Turmeric and ginger are anti-inflammatory powerhouses","Seamless delivery of nutrients first thing in the morning","Alkalises the body before any food is introduced","Energising without caffeine — sustained gentle energy"],u:"INGREDIENTS: 2 tbsp sea moss gel, 1 tsp turmeric powder, 1 inch fresh ginger (grated), juice of 1 lime, 250ml coconut water, 1 tsp agave or date syrup, pinch of black pepper (activates turmeric). METHOD: Blend all ingredients until smooth. Drink immediately on an empty stomach. This is your morning medicine before food.",i:"Before the first bite of food, give your body minerals. This tonic is not breakfast — it is preparation. The body receives it differently on an empty stomach.",ca:"The lime and ginger can be strong on an empty stomach — have a small amount of water first if you are sensitive. Build up to the full amount."},
  {n:"Alkaline Smoothie",e:"",c:"recipe",col:"#3a8a4a",t:"The Dr. Sebi Green",sebi:true,form:"Recipe - 1-2 servings",b:["100% Dr. Sebi approved ingredients","Deeply alkaline — raises body pH immediately","Complete nutrition: protein (hemp), minerals (sea moss), healthy fat (avocado)","Natural energy without caffeine","Anti-inflammatory and immune-boosting","Tastes like a treat, works like medicine"],u:"INGREDIENTS: 1 cup spring water or coconut water, 2 tbsp sea moss gel, half an avocado, 1 cup mango (frozen or fresh), handful of leafy greens (not spinach — use lettuce or dandelion greens), 3 tbsp hemp seeds, 1 tsp agave. METHOD: Blend all ingredients until completely smooth. Drink immediately — the nutrients oxidise quickly once blended.",i:"Green is the colour of life. Every ingredient in this smoothie was alive, untouched by a factory. You can taste the difference.",ca:"Use spring water or coconut water — not tap water which contains chlorine that disrupts gut bacteria. Drink within 20 minutes of blending for maximum nutrition."},
  {n:"Ital Breakfast Bowl",e:"",c:"recipe",col:"#c8a040",t:"Ital Morning Ritual",ital:true,form:"Recipe - 1 serving",b:["No eggs, no dairy, no processed foods","High in fibre, plant protein and complex carbohydrates","Tropical fruits provide vitamins and natural sugars for morning energy","Hemp seeds and sesame provide complete protein","Agave or date sugar for sustained energy — not a spike","Can be made in 10 minutes"],u:"BASE: cook quinoa or amaranth as porridge with coconut milk and a pinch of cinnamon. TOPPINGS: sliced mango and papaya, fresh berries, hemp seeds, sesame seeds, a drizzle of agave, a spoonful of sea moss gel. OPTIONAL: grated fresh ginger stirred through the porridge while cooking. Serve warm.",i:"Ital morning is slow, intentional and alive. No rush, no packet food, no compromise. What you eat first sets the tone for everything that follows.",ca:"Use frozen fruit in winter when fresh tropical fruit is unavailable — freeze your own when in season for best quality."},
  {n:"Callaloo and Ackee",e:"",c:"recipe",col:"#7a9a3a",t:"The Ital Classic",ital:true,form:"Recipe - Serves 2",b:["Quintessential Jamaican Ital breakfast — completely plant-based","High in iron (callaloo), plant fat and protein (ackee)","Complete meal — protein, fat and greens in one pan","Scotch bonnet, thyme and spring onion — the flavour foundation of Ital cooking","Can be served with boiled plantain, breadfruit or spelt flatbread","Ready in 20 minutes"],u:"INGREDIENTS: 1 tin ackee (drained), 1 bunch callaloo (or substitute spinach), 1 onion, 3 spring onions, 2 cloves garlic, half scotch bonnet (seeded for less heat), 3 sprigs thyme, coconut oil, black pepper. METHOD: Saute onion, garlic and scotch bonnet in coconut oil. Add callaloo and wilt. Gently fold in ackee (it breaks easily). Season with thyme and black pepper. Serve immediately.",i:"This dish has fed Caribbean people for generations as a morning meal. It is simple, quick, deeply nourishing and irreplaceable. Once you eat it, processed breakfast feels like an insult.",ca:"Ackee must be fully ripe and cooked — tinned is safe. Never add salt to the ackee tin liquid. Handle ackee gently — it falls apart easily."},
  {n:"Herb Tea Tonic Blend",e:"",c:"recipe",col:"#6a8a4a",t:"The Evening Medicine",sebi:true,ital:true,form:"Recipe - 1 serving",b:["Combines Dr. Sebi approved herbs for a full-body evening tonic","Dandelion and burdock clean the blood and liver","Chamomile calms the nervous system for sleep","Ginger aids digestion of the day's food","Elderflower supports the immune system","Completely caffeine-free — safe to drink before sleep"],u:"BLEND: 1 tsp dried dandelion root, 1 tsp dried burdock root, 1 tsp chamomile flowers, half tsp dried ginger, 1 tsp elderflower. Steep in just-boiled water for 10-15 minutes. Strain well. Sweeten with agave or date syrup. This is your evening medicine — drink slowly, intentionally, before 9pm.",i:"In Ital living, the evening is for releasing what the day brought. This blend helps the body do its overnight work — cleansing, repairing, restoring. Do not rush it.",ca:"Do not boil the flowers — pour over just-boiled water and cover while steeping to keep the volatile compounds in. Chamomile may cause drowsiness — this is the point."}

var teeth = [
  {n:"Myrrh Gum",e:"",c:"drsebi",col:"#c8a040",t:"The Gum Healer",sebi:true,b:["Dr. Sebi's #1 oral herb — core ingredient in his official Tooth Powder","Powerful antiseptic — kills bacteria that cause decay and gum disease","Anti-inflammatory — reduces gum soreness, swelling and bleeding","Speeds repair of mouth ulcers, cuts and chapped lips","Eliminates bad breath with sweet-smelling antimicrobial compounds","Traditionally used across Africa and the Middle East for oral and spiritual ritual"],u:"As tooth powder: mix with Encino and Cuachalalate, apply to a wet toothbrush and brush gently. As a rinse: steep 1 tsp in boiling water for 10 minutes, cool and use as a mouthwash. As a tincture: dilute 2-3 drops in water and rinse.",i:"Burned in temples and used in sacred rites for thousands of years — myrrh purifies not just the mouth but the space around you. Ancient Egyptian, Rastafarian and Islamic traditions all hold it sacred.",ca:"Do not ingest the essential oil form. Avoid high doses in pregnancy. May interact with blood sugar medication."},
  {n:"Encino (Oak Bark)",e:"",c:"drsebi",col:"#8B4513",t:"The Gum Tightener",sebi:true,b:["Dr. Sebi's tooth powder ingredient — his specific choice for gum strength","Rich in tannins — astringent compounds that tighten and tone gum tissue","Tightens tooth sockets — helps retain teeth into old age","Reduces gum inflammation and bleeding","Antibacterial against the bacteria responsible for plaque and decay","Promotes gum regeneration and tissue healing"],u:"As powder: combine with myrrh and cuachalalate for Dr. Sebi's tooth powder formula. As a rinse: steep 1 tsp dried bark in boiling water for 15 minutes, strain well, cool and rinse for 30-60 seconds. Do not swallow.",i:"The oak has been medicine for millennia — its bark holds the same strength that lets the tree stand for hundreds of years. Dr. Sebi chose it to give that strength to the gums.",ca:"Do not swallow in large amounts — high tannin content can irritate the stomach. External and rinse use only for oral application."},
  {n:"Cuachalalate",e:"",c:"drsebi",col:"#a05020",t:"The Cell Rejuvenator",sebi:true,b:["Third pillar of Dr. Sebi's tooth powder — the rejuvenation herb","Anti-inflammatory — reduces gum inflammation at a cellular level","Promotes regeneration of the cells lining the mouth","Strengthens gum tissue from within","Traditionally used in Mexican and Central American herbal medicine for digestive and oral health","Antimicrobial — reduces harmful bacteria in the mouth"],u:"As part of the tooth powder blend with myrrh and encino. As a rinse: steep bark in hot water for 15 minutes, cool and rinse. Widely available as a tea in Latin herbal stores.",i:"A traditional Mesoamerican healing bark — the same plant cultures that gave us ceremonial cacao also gave us cuachalalate. It reminds us that oral health is part of the whole.",ca:"Generally very safe for oral use. Avoid swallowing large amounts. Limited research in pregnancy — use with caution."},
  {n:"Cloves",e:"",c:"pain",col:"#6B3A2A",t:"The Tooth Pain Herb",b:["Eugenol — the compound in cloves is the basis of dental anaesthetic worldwide","Kills bacteria responsible for tooth decay and gum disease","Instant relief for toothache when applied directly to the affected area","Anti-inflammatory — reduces swelling in gums and jaw","Powerful antifungal — addresses oral candida","Fresh breath — natural antimicrobial that eliminates odour at the source"],u:"For tooth pain: press a whole clove against the aching tooth or gum. Or dilute 1-2 drops of clove oil in coconut oil and apply with a cotton ball. As mouthwash: steep 4-6 cloves in boiling water for 10 minutes, cool and rinse.",i:"Every dentist's surgery smells of eugenol — cloves. The plant world gave us anaesthesia long before the laboratory did.",ca:"Clove oil is very concentrated — never apply undiluted directly to gums as it can cause burns. Avoid large amounts in pregnancy. Not for long-term internal use in high doses."},
  {n:"Neem (Oral Use)",e:"",c:"antibacterial",col:"#3d6b2a",t:"The Original Toothbrush",b:["Used as a toothbrush (chew stick) across Africa, India and the Middle East for millennia","Powerful antibacterial — inhibits the bacteria Streptococcus mutans responsible for cavities","Reduces plaque formation and gingivitis","Antifungal — eliminates oral candida overgrowth","Reduces gum inflammation and bleeding","Alkalises the mouth — changes pH to prevent bacterial growth"],u:"Chew stick method: use a fresh neem twig, chew one end until it becomes brush-like, then brush teeth and gums. As a rinse: steep 5-7 leaves in boiling water for 10 minutes, cool and rinse. Neem toothpaste or powder is also widely available.",i:"Before the toothbrush existed, neem was it. Every civilisation that had access to this tree used it for oral care. The modern toothbrush is a plastic replica of what nature already made.",ca:"Bitter taste takes getting used to. Internal consumption of neem oil is toxic — oral rinse and chew stick use only for dental purposes."},
  {n:"Oil Pulling (Coconut Oil)",e:"",c:"cleanse",col:"#c8b870",t:"The Ancient Mouth Cleanse",b:["Ayurvedic practice — 3,000 years of oral health tradition","Pulls bacteria, toxins and debris from between teeth and gum pockets","Reduces Streptococcus mutans — the primary bacteria causing tooth decay","Reduces plaque and gingivitis — backed by multiple clinical studies","Whitens teeth naturally over time","Freshens breath by removing odour-causing bacteria at the root"],u:"Take 1 tablespoon of coconut oil (or sesame oil for traditional Ayurvedic use). Swish and pull through teeth for 15-20 minutes first thing in the morning on an empty stomach. Do not swallow — spit into the bin (not the sink — oil can clog drains). Rinse with warm salt water after.",i:"Every morning before you eat or drink — the oil becomes a white emulsion filled with what was living in your mouth overnight. It is humbling and purifying in equal measure.",ca:"Do not swallow the oil — it is full of bacteria after pulling. Start with 5 minutes if 20 feels too long. Never replace brushing with oil pulling — it works alongside, not instead."},
  {n:"Activated Charcoal",e:"",c:"whitening",col:"#2a2a2a",t:"The Natural Whitener",b:["Highly porous surface binds to surface stains — coffee, tea, red wine, plaque","Natural teeth whitening without harsh chemical bleaching agents","Antibacterial — absorbs the bacteria and toxins that cause bad breath","Removes surface tartar build-up when used consistently","Detoxifying — draws impurities from gum tissue","No fluoride, no synthetic abrasives"],u:"Apply a small amount to a wet toothbrush. Brush very gently for 2 minutes. Rinse thoroughly. Use 2-3 times per week maximum — not as a daily toothpaste. Can be combined with coconut oil as a paste.",i:"Black as night, leaves teeth white — activated charcoal is one of those things that looks alarming and works quietly. Trust the process.",ca:"Use sparingly — too frequent use can wear enamel over time. Not suitable for those with crowns, veneers or caps (can stain the bonding material). Avoid swallowing large amounts."},
  {n:"Salt Water Rinse",e:"",c:"cleanse",col:"#a0c0d0",t:"The Oldest Rinse",b:["Alkalises the mouth — bacteria cannot survive in alkaline environments","Draws fluid from infected or swollen gum tissue — reduces swelling","Disrupts biofilm (plaque) without chemical intervention","Speeds healing after tooth extraction, ulcers or gum cuts","Antifungal — disrupts oral candida growth","Free, effective, zero side effects — used across every civilisation"],u:"Dissolve half a teaspoon of natural sea salt (not table salt) in a glass of warm water. Rinse for 30-60 seconds, focusing on problem areas. Spit. Use 2-3 times daily when dealing with infection or after dental work. Daily use as a preventative rinse is safe.",i:"The simplest medicine is the sea. Salt water rinse is what healers recommended before there were healers. It still works better than most things in the dental aisle.",ca:"Use natural sea salt or Himalayan salt — not processed table salt (sodium chloride with additives). Do not swallow. Not a replacement for brushing."},
  {n:"Oregano Oil",e:"",c:"antibacterial",col:"#5a7a2a",t:"The Oral Antibiotic",b:["Carvacrol — the active compound is one of the most powerful natural antimicrobials known","Kills bacteria, viruses and fungi in the mouth simultaneously","Effective against drug-resistant bacteria including MRSA","Reduces gum infection and inflammation rapidly","Helps with dental abscesses when used as a targeted application","Anti-biofilm — disrupts the protective coating bacteria form on teeth"],u:"Dilute 1-2 drops in a tablespoon of coconut oil and swish for 5-10 minutes. Or dilute in water and use as a mouthwash. Never apply undiluted — it is extremely potent. Use for acute infections for 5-7 days.",i:"Carvacrol does not care whether bacteria have become antibiotic resistant — it uses a completely different mechanism. Nature does not create drug resistance.",ca:"Never use undiluted — causes burns to sensitive oral tissue. Avoid in pregnancy in medicinal doses. Not for long-term daily use as a mouthwash — use for targeted short periods."}

var boards = [
  {id:"herbs", label:"Herbalism",    desc:"Teas, leaves, roots and bark. Everyday plant healing."},
  {id:"oils",  label:"Aromatherapy", desc:"Essential oils for healing, mood, space and ritual."},
  {id:"plants",label:"Plant Medicine",desc:"Sacred plants used ceremonially, with intention and respect."},
  {id:"pantry",label:"Living Kitchen", desc:"Dr.Sebi approved foods, Ital staples and recipes. The kitchen as apothecary."},
  {id:"teeth", label:"Teeth & Oral", desc:"Dr.Sebi's tooth powder herbs, natural oral care and ancient mouth practices."}
];

var currentBoard = "herbs";
var currentCat   = "all";

function getData() {
  if (currentBoard === "herbs")  return {items: herbs,  cats: herbCats};
  if (currentBoard === "oils")   return {items: oils,   cats: oilCats};
  if (currentBoard === "plants") return {items: plants, cats: plantCats};
  if (currentBoard === "teeth")   return {items: teeth,   cats: teethCats};
  return {items: kitchen, cats: kitchenCats};
}

function getItems() {
  var d = getData();
  if (currentCat === "all")    return d.items;
  if (currentCat === "drfire") return d.items.filter(function(x){return x.fire;});
  if (currentCat === "drsebi") return d.items.filter(function(x){return x.sebi || x.c === "drsebi";});
  return d.items.filter(function(x){return x.c === currentCat;});
}

function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render() {
  var board = boards.filter(function(b){return b.id===currentBoard;})[0];
  var d = getData();
  var items = getItems();

  var filterHtml = "";
  for (var k in d.cats) {
    var v = d.cats[k];
    var active = k === currentCat;
    filterHtml += '<button class="filter-btn' + (active?' active':'') + '" style="' + (active ? 'border-color:'+v.col+';background:'+v.col+'22;color:#e8dcc8' : 'border-color:rgba(232,184,75,0.1)') + '" onclick="setCat(\''+k+'\')">' + v.l + '</button>';
  }

  var cardsHtml = "";
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var badges = "";
    if (item.fire) badges += '<span class="badge badge-fire">Dr.Fire</span>';
    if (item.sebi || item.c === "drsebi") badges += '<span class="badge badge-sebi">Dr.Sebi</span>';
    if (item.ital) badges += '<span class="badge badge-ital">Ital</span>';
    var badgeDiv = badges ? '<div class="card-badges">' + badges + '</div>' : '';
    var tagText = item.fire ? item.fire.role : item.t;
    var meta = item.method || item.form || item.trad || "";
    var metaHtml = meta ? '<p class="meta-tag">' + esc(meta) + '</p>' : '';
    cardsHtml += '<div class="card" onclick="openModal('+i+')" style="border-color:'+item.col+'22" onmouseenter="this.style.background=\''+item.col+'18\';this.style.borderColor=\''+item.col+'66\';this.style.transform=\'translateY(-2px)\'" onmouseleave="this.style.background=\'rgba(255,255,255,0.02)\';this.style.borderColor=\''+item.col+'22\';this.style.transform=\'none\'">'
      + '<div class="card-dot" style="background:'+item.col+'"></div>'
      + badgeDiv
      + '<span class="card-emoji">' + item.e + '</span>'
      + '<p class="card-name">' + esc(item.n) + '</p>'
      + '<p class="card-tag" style="color:'+item.col+'">' + esc(tagText) + '</p>'
      + metaHtml
      + '<p class="card-tap">TAP TO OPEN</p>'
      + '</div>';
  }

  var boardBtns = boards.map(function(b){
    return '<button class="board-btn'+(b.id===currentBoard?' active':'')+'" onclick="setBoard(\''+b.id+'\')">' + b.label + '</button>';
  }).join('');

  document.getElementById('root').innerHTML =
    '<div class="wrap">'
    + '<div style="margin-bottom:2rem"><p class="hdr-label">Personal Reference</p><h1 class="hdr-title">The <em>Apothecary</em></h1><p class="hdr-sub">Herbalism - Aromatherapy - Plant Medicine - Food as Medicine</p></div>'
    + '<div class="boards">' + boardBtns + '</div>'
    + '<div class="board-desc">' + esc(board.desc) + '</div>'
    + '<div class="filters">' + filterHtml + '</div>'
    + '<div class="grid">' + cardsHtml + '</div>'
    + '</div>';

  window._items = items;
}

function setBoard(id) { currentBoard = id; currentCat = "all"; render(); }
function setCat(cat)   { currentCat = cat; render(); }

function openModal(idx) {
  var item = window._items[idx];
  if (!item) return;

  document.getElementById('m-emoji').textContent   = item.e || "";
  document.getElementById('m-name').textContent    = item.n;
  document.getElementById('m-tagline').textContent = item.t;
  document.getElementById('m-tagline').style.color = item.col;

  var badges = "";
  if (item.fire) badges += '<span class="modal-badge badge-fire">Dr.Fire Protocol</span>';
  if (item.sebi || item.c === "drsebi") badges += '<span class="modal-badge badge-sebi">Dr.Sebi Approved</span>';
  if (item.ital) badges += '<span class="modal-badge badge-ital">Ital</span>';
  document.getElementById('m-badges').innerHTML = badges;

  var fb = document.getElementById('m-firebox');
  if (item.fire) {
    fb.style.display = "block";
    document.getElementById('m-firetitle').textContent = "Dr.Fire - " + item.fire.role;
    document.getElementById('m-firetext').textContent  = item.fire.p;
    document.getElementById('m-firefreq').textContent  = "FREQUENCY: " + item.fire.f;
  } else { fb.style.display = "none"; }

  var ib = document.getElementById('m-italbox');
  var noteText = item.i || "";
  if (noteText) {
    ib.style.display = "block";
    ib.style.borderLeftColor = item.col;
    ib.style.background = item.col + "18";
    document.getElementById('m-ital').textContent = noteText;
  } else { ib.style.display = "none"; }

  var trad = document.getElementById('m-tradition');
  var meta = item.trad || item.method || item.form || "";
  if (meta) { trad.style.display = "block"; trad.textContent = meta; }
  else trad.style.display = "none";

  document.getElementById('m-bsec').style.color = item.col;
  var bHtml = "";
  for (var i = 0; i < item.b.length; i++) bHtml += '<li>' + esc(item.b[i]) + '</li>';
  document.getElementById('m-benefits').innerHTML = bHtml;

  document.getElementById('m-usage').textContent   = item.u;
  document.getElementById('m-caution').textContent = item.ca;
  document.getElementById('modal-box').style.borderColor = item.col + "55";
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.getElementById('modal-close').addEventListener('click', closeModal);

render();
</script>
