var kitchen=[
// ITAL STAPLES
{n:"Ackee",e:"",c:"ital",col:"#e8c030",t:"The National Fruit",ital:true,form:"Cooked only — never raw",b:["National fruit of Jamaica — central to Ital cooking","Buttery egg-like texture — the plant-based protein of the Ital breakfast","Rich in fatty acids, zinc and vitamin C","High in potassium and B vitamins","Complete morning meal with callaloo — protein, fat and iron in one pan","Arrived in Jamaica from West Africa — now the soul of the island's food"],u:"MUST be fully ripe and cooked — unripe ackee is toxic. Tinned ackee in brine is safe. Saute gently with onion, scotch bonnet, thyme and spring onion. Fold in carefully — it breaks easily.",i:"Ackee came to Jamaica on a slave ship from West Africa and became the soul of the island's food. It is Ital history on a plate.",ca:"NEVER eat unripe ackee — contains hypoglycin A, which causes Jamaican Vomiting Sickness. Tinned versions are safe."},
{n:"Callaloo",e:"",c:"ital",col:"#2a6a2a",t:"The Iron Leaf",ital:true,form:"Cooked - Soup - Side",b:["Staple green of Caribbean Ital cooking — more mineral-rich than spinach","Very high in iron — essential for those not eating meat","Rich in calcium, potassium, vitamins A, C and K","Anti-inflammatory and antioxidant","Supports bone health and immune function","Deeply alkaline — one of the most nutrient-dense greens available"],u:"Saute with garlic, onion, thyme, scotch bonnet and coconut oil. Cook down like spinach. Use in callaloo and ackee, callaloo soup, or as a side with rice and peas.",i:"Every Ital kitchen begins with callaloo. It is the first green, the foundation leaf, the iron in the blood of the cooking.",ca:"Callaloo is amaranth leaf in the Caribbean — ensure you buy the correct plant. Those on blood thinners should be mindful of the high Vitamin K content."},
{n:"Plantain",e:"",c:"ital",col:"#c8a020",t:"The Starchy Staple",ital:true,form:"Boiled - Fried - Baked - Porridge",b:["Staple carbohydrate of Ital and Caribbean cooking","Rich in complex carbohydrates — sustained energy without blood sugar spikes","High in potassium, vitamin C, vitamin B6 and magnesium","Resistant starch when green — feeds beneficial gut bacteria","Anti-inflammatory — reduces gut inflammation","Both sweet (ripe) and savoury (green) applications"],u:"Green: boil, bake or fry in coconut oil for a savoury starchy side. Ripe (yellow-black): fry in coconut oil for sweet plantain, or bake. Fully ripe: blend into smoothies.",i:"Plantain is not banana. It is the carbohydrate that fed African and Caribbean people through generations. Versatile, filling and faithful.",ca:"Baking or boiling is the Ital way. Buy ripe for sweetness, green for savoury use."},
{n:"Rice and Peas",e:"",c:"ital",col:"#7a8a5a",t:"The Ital Sunday Dish",ital:true,form:"Rice dish - Sunday meal",b:["Foundation dish of Jamaican Ital cooking — not a side, a meal","Kidney beans or gungo peas provide complete protein when combined with rice","Coconut milk makes it dairy-free and deeply rich","Thyme, scotch bonnet and spring onion are the holy trinity of Ital flavour","High in fibre, iron, plant protein and complex carbohydrates","Built to sustain hard work all day"],u:"Soak kidney beans or gungo peas overnight. Cook in coconut milk with thyme, whole scotch bonnet, spring onion, garlic. Add washed rice and cook until absorbed.",i:"Rice and peas is not just food. It is Sunday. It is community. It is the table that everyone gathers around. In Ital living, food is always also communion.",ca:"Ensure beans are fully cooked — undercooked kidney beans cause food poisoning. Soak overnight and boil vigorously for the first 10 minutes."},
{n:"Scotch Bonnet",e:"",c:"ital",col:"#e84020",t:"The Sacred Heat",ital:true,form:"Fresh - Dried - Sauce",b:["The defining flavour of Caribbean Ital cooking — irreplaceable","High in capsaicin — powerful anti-inflammatory and circulatory herb","One of the highest vitamin C contents of any food","Antimicrobial — kills harmful bacteria in food and the gut","Boosts metabolism and supports weight management","Anti-cancer — capsaicin shown to trigger apoptosis in cancer cells"],u:"Use whole in cooking for flavour without heat (remove before eating) or chopped for full fire. Never touch your eyes after handling. Add to rice and peas, soups, stews and callaloo.",i:"The scotch bonnet does not compromise. It is the full expression of heat — unapologetic, clarifying and alive. Ital cooking is not bland. It is vibrant.",ca:"Extremely hot — handle with care, wash hands thoroughly after. Those with stomach ulcers or IBS should use with caution."},
{n:"Breadfruit",e:"",c:"ital",col:"#8a9a4a",t:"The Ital Bread",ital:true,form:"Roasted - Boiled - Fried - Chips",b:["One of the most abundant and sustainable starchy foods on Earth","Starchy carbohydrate and plant protein in one fruit","Rich in potassium, magnesium, calcium and B vitamins","Fibre-rich — supports gut health and sustained energy","Lower glycaemic index than bread or white rice","Versatile — can replace bread, potato and pasta"],u:"Roast whole over an open flame or in the oven until skin blackens and flesh is tender — the best method. Boil and mash like potato. Fry into breadfruit chips.",i:"Captain Bligh brought breadfruit to the Caribbean to feed the enslaved. They transformed it into one of the most beloved Ital foods. Resistance through nourishment.",ca:"Must be cooked — raw breadfruit is indigestible. Buy from Caribbean, African or Asian grocers."},
// GRAINS
{n:"Amaranth",e:"",c:"grain",col:"#c8732a",t:"The Ancient Grain",sebi:true,ital:true,form:"Grain - Flour - Porridge",b:["Dr. Sebi approved — one of the oldest cultivated foods on Earth","Complete protein — contains all essential amino acids, rare for a grain","Rich in iron, calcium, magnesium and phosphorus","Gluten-free — easy on the digestive system","High in lysine — an amino acid most grains lack","Anti-inflammatory — reduces systemic inflammation"],u:"Cook like rice: 1 cup to 2 cups water, simmer 20 minutes. Use as porridge with agave and berries. Ground into flour for flatbreads. Puff by heating dry in a pan.",i:"Used by the Aztecs as a sacred food — Cortez banned it to break their power. You are reclaiming it every time you eat it.",ca:"Buy whole grain or flour only — avoid amaranth products with additives or hybrid crossings."},
{n:"Quinoa (Red or Black)",e:"",c:"grain",col:"#b8a040",t:"The Complete Protein Seed",sebi:true,ital:true,form:"Red or Black — not white",b:["Dr. Sebi approved — one of his few grain endorsements","Complete protein with all 9 essential amino acids","Rich in magnesium, iron, zinc, potassium and B vitamins","Gluten-free and alkaline-forming","Red and black quinoa retain the outer seed coat — this bran layer provides the roughage, fibre and nutrients that white quinoa loses","The outer coating is the nutritional armour — buy red or black for maximum benefit"],u:"Buy RED or BLACK quinoa — not white. The outer seed coat (bran layer) on red and black provides the roughage and fibre your gut needs. This is what you were told about — the coating that white quinoa strips away. Rinse thoroughly first. Cook 1 cup to 2 cups water for 15 minutes.",i:"Sacred to the Incas — called the mother of all grains. It is not a grain at all. It is a seed. That is why Dr. Sebi approved it.",ca:"Rinse well before cooking — unrinsed quinoa can taste bitter. Buy RED or BLACK specifically — not white."},
{n:"Spelt",e:"",c:"grain",col:"#c8a060",t:"The Ancient Wheat",sebi:true,form:"Flour - Bread - Pasta",b:["Dr. Sebi approved alternative to hybrid modern wheat","Ancient grain — not crossbred like modern wheat varieties","Contains gluten but in a more digestible form than modern wheat","Rich in B vitamins, magnesium and zinc","Higher protein content than regular wheat","More alkaline-forming than modern wheat products"],u:"Use spelt flour for baking — bread, flatbreads, pancakes. Spelt pasta is widely available. Whole spelt berries can be cooked like rice.",i:"Before wheat was hybridised into the hard-to-digest thing it is today, spelt was the bread. Going back to spelt is going back to what the body recognises.",ca:"Still contains gluten — not suitable for coeliac disease. Those sensitive to modern wheat may tolerate spelt but test carefully."},
{n:"Teff",e:"",c:"grain",col:"#8a6a30",t:"The Ethiopian Staple",sebi:true,ital:true,form:"Flour - Porridge - Injera",b:["Dr. Sebi approved grain — native to Ethiopia and Eritrea","Tiny grain, massive nutrition — calcium, iron, protein and fibre","Gluten-free and alkaline-forming","Rich in resistant starch — feeds good gut bacteria and regulates blood sugar","High in iron — essential for those not eating meat","Contains all 8 essential amino acids"],u:"As porridge: simmer 1 cup teff in 3 cups water for 15-20 minutes, add date sugar and fresh fruit. As injera: ferment teff flour with water for 2-3 days to make the spongy Ethiopian flatbread.",i:"The grain that sustained some of the longest-living hardest-working people on Earth. Ethiopian distance runners eat teff. That tells you everything.",ca:"Ensure you source pure teff — some commercial products mix with other flours."},
{n:"Wild Rice",e:"",c:"grain",col:"#3a4a2a",t:"The Water Grass",sebi:true,ital:true,form:"Grain - Salad - Soup",b:["Dr. Sebi approved — technically a grass seed, not a true rice","More protein than any true rice variety","Rich in antioxidants — darker colour signals higher polyphenol content","Gluten-free and high in B vitamins","Lower glycaemic index than white or brown rice","Anti-inflammatory and supports heart health"],u:"Cook 1 cup wild rice in 3 cups water for 45-50 minutes until grains split open. Use in soups, salads, stuffed vegetables or alongside stews.",i:"Harvested from the lakes of North America by indigenous peoples for thousands of years. It grows wild in water. That is why it carries the energy of living water.",ca:"Takes longer to cook than regular rice — do not undercook as it will be tough."},
// FRUIT
{n:"Avocado",e:"",c:"fruit",col:"#3a6a2a",t:"The Healing Fat",sebi:true,ital:true,form:"Raw - Smoothie - Sauce",b:["Dr. Sebi approved — one of his highest recommended foods","Rich in oleic acid (the same fat as olive oil) — anti-inflammatory and heart-protective","Contains more potassium than a banana","Loaded with fibre, folate, vitamins K, C, B5 and B6","Monounsaturated fats help absorb fat-soluble nutrients from other vegetables","Alkaline-forming — raises the body's pH"],u:"Eat raw in salads, on spelt bread, as guacamole or blended into smoothies. Dress with lime juice and sea salt.",i:"Green, creamy, rich — the avocado is Jah's butter. It gives you the fat you need without what you do not.",ca:"Ripe only — unripe avocado can cause digestive discomfort. Latex allergy sufferers may react to avocado."},
{n:"Coconut (Young)",e:"",c:"fruit",col:"#c8b060",t:"The Whole Food",sebi:true,ital:true,form:"Water - Flesh - Oil - Milk",b:["Every part of the coconut is medicine or food — nothing is wasted","Coconut water is a natural electrolyte drink — hydrates at a cellular level","Coconut flesh is rich in MCT fats — immediate energy that bypasses digestion","Coconut oil is antimicrobial — lauric acid kills viruses, bacteria and fungi","Coconut milk is the Ital replacement for all dairy","Alkaline-forming and deeply nourishing"],u:"Drink fresh coconut water straight from the coconut. Use coconut oil for cooking at high heat (stable fat). Use coconut milk in stews, curries and porridge. Grate fresh flesh into dishes.",i:"In Ital living, coconut replaces dairy completely. The milk of the earth, not the animal. Every part given freely by the tree.",ca:"Coconut oil is high in saturated fat — use in moderation if you have heart disease. Buy raw, cold-pressed virgin coconut oil only."},
{n:"Mango",e:"",c:"fruit",col:"#f0a020",t:"The King of Fruit",sebi:true,ital:true,form:"Raw - Juice - Smoothie",b:["Dr. Sebi approved — one of the highest vibrational fruits","Rich in vitamins A, C, B6, folate and potassium","Digestive enzymes (amylases) that help break down other foods","Anti-inflammatory — quercetin and mangiferin fight chronic inflammation","Supports eye health — lutein and zeaxanthin protect the retina","Boosts immunity and alkalises the body"],u:"Eat fresh and ripe — never unripe. Blend into smoothies or juices. Dice into salads or salsas.",i:"Sweet, golden and abundant — the mango is the sun in fruit form. In Ital living, sweetness from Jah's trees is the only sweetness you need.",ca:"Very high in natural sugar — eat in moderation if diabetic or managing blood sugar."},
{n:"Figs",e:"",c:"fruit",col:"#8a3a6a",t:"The Sacred Fruit",sebi:true,ital:true,form:"Fresh - Dried - Tea",b:["Mentioned in the Quran, the Bible and the Vedas — one of the most sacred fruits on Earth","Dr. Sebi approved — deeply alkaline and mineral-rich","High in calcium — the best plant-based calcium source after sesame","Rich in iron, potassium and magnesium","Natural laxative — relieves constipation gently","High in antioxidants — protect against cancer and heart disease"],u:"Eat fresh when in season — the best way. Dried figs are available year-round. Soak dried figs overnight for smoother digestion.",i:"Jah Himself swore by the fig in scripture. This fruit carries millennia of sacred energy.",ca:"Dried figs are very high in sugar — eat in moderation. Ensure they are unsulphured (no sulphur dioxide preservative)."},
// NUTS AND SEEDS
{n:"Hemp Seeds",e:"",c:"nuts",col:"#7a8a3a",t:"The Complete Protein",sebi:true,ital:true,form:"Raw - Oil - Milk - Powder",b:["Dr. Sebi approved — one of the most complete foods on Earth","Complete protein — all 10 essential amino acids in ideal ratios","Perfect omega-3 to omega-6 ratio — 3:1, the ratio the human body needs","Rich in gamma-linolenic acid (GLA) — anti-inflammatory and hormone-balancing","High in magnesium, zinc, iron and B vitamins","Easy to digest — no antinutrients like lectins or phytates"],u:"Sprinkle raw hemp seeds on everything — salads, porridge, soups, smoothies. Blend into a hemp milk (4 tbsp seeds to 500ml water, blend and strain). Use hemp seed oil raw as a dressing — never heat it.",i:"The seed of the sacred plant, stripped of its medicine but full of nutrition. Hemp feeds every system of the body.",ca:"Hemp seed oil goes rancid quickly — refrigerate and use within 6 weeks of opening. Do not heat hemp oil — destroys the omega-3 fatty acids."},
{n:"Sesame Seeds (Tahini)",e:"",c:"nuts",col:"#c8a860",t:"The Calcium King",sebi:true,ital:true,form:"Seeds - Tahini - Oil",b:["Highest plant-based calcium content of any food — higher than dairy by weight","Dr. Sebi approved protein and fat source","Rich in iron, zinc, magnesium, phosphorus and B vitamins","Sesamin and sesamolin — lignans with powerful anti-inflammatory effects","Supports healthy blood pressure","Tahini (ground sesame) is a complete protein source"],u:"Use tahini as a base for dressings, dips and sauces. Sprinkle sesame seeds on grains and salads. Black sesame seeds have even higher antioxidant content than white.",i:"Tiny seed, enormous nourishment. Open sesame — the ancient phrase came from the sesame pod bursting open when ripe.",ca:"Sesame allergy is one of the major food allergens — be aware. Buy raw, unhulled tahini for maximum mineral content."},
{n:"Sunflower Seeds",e:"",c:"nuts",col:"#d4a020",t:"The Vitamin E Powerhouse",form:"Raw - Butter - Sprinkled",b:["Richest plant-based source of vitamin E — powerful antioxidant for skin and cell protection","High in magnesium — essential for muscle function, sleep and blood pressure","Rich in selenium — thyroid support and antioxidant defence","Healthy linoleic acid (omega-6) — balanced well with hemp and flax","Rich in B vitamins — especially B1 (thiamine) for energy metabolism","Good plant-based source of protein and fibre"],u:"Eat raw as a snack. Sprinkle on salads, porridge and grain bowls. Blend into sunflower seed butter as a nut-free alternative to peanut butter.",i:"Grown facing the sun — the sunflower seed carries the energy of what it follows. Rich, warm, nourishing.",ca:"Buy raw and unsalted — roasting oxidises the delicate oils. Store in a cool dark place or refrigerate once opened."},
{n:"Pumpkin Seeds (Pepitas)",e:"",c:"nuts",col:"#4a7a3a",t:"The Mineral Bomb",form:"Raw - Roasted - Oil",b:["Highest plant-based source of zinc — critical for immunity, wound healing and hormone production","Rich in magnesium — one of the most magnesium-dense foods available","Tryptophan — converts to serotonin and melatonin, supporting mood and sleep","Good source of plant-based omega-3","Anti-inflammatory — reduces systemic inflammation","Traditionally used to support prostate health and expel parasites"],u:"Eat raw for maximum nutrition. Lightly toast in a dry pan for flavour. Sprinkle on soups, salads and grain bowls. Blend into pumpkin seed butter or add to smoothies.",i:"Small and green and quietly powerful. The seed inside the fruit that feeds the body what the body most needs — zinc, magnesium, rest.",ca:"Buy raw and unsalted. Those with nut allergies usually tolerate seeds — but always check first."},
{n:"Flaxseeds (Linseed)",e:"",c:"nuts",col:"#8a6a2a",t:"The Omega-3 Seed",sebi:true,form:"Ground - Oil - Whole",b:["Richest plant-based source of ALA omega-3 fatty acids","High in lignans — plant oestrogens that support hormone balance and reduce cancer risk","Ground flaxseed is one of the best plant-based sources of fibre","Anti-inflammatory — supports heart and brain health","Reduces LDL cholesterol","Dr. Sebi approved — alkaline-forming and non-hybrid"],u:"Always use GROUND flaxseed — whole seeds pass through undigested. Add 1-2 tbsp ground flax to smoothies, porridge, or baked goods. Flaxseed oil can be used as a dressing but never heated.",i:"The seed that opens you — flaxseed loosens what is stuck, feeds the gut and provides the omega-3 that a meat-free body needs.",ca:"Do not heat flaxseed oil — destroys the omega-3 fatty acids. Grind fresh in small batches — pre-ground goes rancid quickly."},
{n:"Cashew Nuts",e:"",c:"nuts",col:"#d4a060",t:"The Creamy Nut",ital:true,form:"Raw - Soaked - Butter - Milk",b:["Richest nut source of iron and zinc","High in magnesium — supports sleep, muscle function and nervous system","Healthy monounsaturated fats — heart-protective","Rich in copper — supports iron absorption and collagen production","Good plant-based source of protein","Cashew milk, butter and cream replace all dairy in Ital cooking"],u:"Soak overnight for easier digestion and better nutrient absorption. Blend soaked cashews with water for cashew milk. Use soaked cashews as a base for sauces, dressings and cheeses. Eat raw as a snack.",i:"Cashew cream, cashew milk, cashew butter — one nut replaces an entire dairy section. In Ital living, this is one of the most useful foods in the kitchen.",ca:"Not Dr. Sebi approved — he considered cashews hybrid. Use with awareness if strictly following Dr. Sebi protocol. Buy raw unsalted only."},
{n:"Walnuts",e:"",c:"nuts",col:"#8a5a2a",t:"The Brain Nut",form:"Raw - Soaked - Oil",b:["Shaped like a brain — the richest nut source of omega-3 fatty acids","High in alpha-linolenic acid (ALA) — anti-inflammatory and neuroprotective","Rich in antioxidants — highest antioxidant activity of any common nut","Supports cognitive function and may reduce risk of dementia","Reduces LDL cholesterol and supports cardiovascular health","Good source of magnesium, B vitamins and plant-based protein"],u:"Eat raw or soak overnight to reduce tannins and improve digestibility. Add to porridge, salads and grain bowls. Walnut oil is excellent for dressings — do not heat it.",i:"The nut that looks like what it feeds. Nature signals its uses in its form — the walnut is for the mind.",ca:"Not Dr. Sebi approved. Buy raw and unsalted. Walnut allergy is common — be aware."},
{n:"Brazil Nuts",e:"",c:"nuts",col:"#c8902a",t:"The Selenium King",form:"Raw - 2-3 daily only",b:["Richest food source of selenium on Earth — 2-3 Brazil nuts provide the full daily requirement","Selenium is essential for thyroid function, immune defence and antioxidant enzymes","Anti-cancer — selenium activates specific tumour-suppressing proteins","Supports testosterone production and reproductive health","Rich in magnesium, zinc and healthy fats","One of the only foods where the dose is literally 2-3 nuts — no more"],u:"Eat 2-3 Brazil nuts per day — no more. That is the optimal selenium dose. More is not better — selenium toxicity (selenosis) is possible with excess. Eat raw.",i:"Two nuts. The body only needs two. This is nature teaching restraint — that optimal health is not about quantity.",ca:"Do NOT eat large quantities — selenium toxicity causes hair loss, nail brittleness and neurological symptoms. 2-3 per day is the dose, not a handful."},
// SWEETENERS
{n:"Date Sugar",e:"",c:"sweetener",col:"#8a5020",t:"The Only Sweetener",sebi:true,ital:true,form:"Sugar - Syrup - Raw Dates",b:["Dr. Sebi's only approved sweetener alongside agave","Made from whole dried dates — retains fibre, minerals and nutrients","Lower glycaemic index than refined sugar — slower blood sugar rise","Rich in potassium, magnesium and B vitamins","Does not strip the body of minerals the way refined sugar does","Alkaline-forming — unlike all refined sugars which are acid-forming"],u:"Use 1:1 in place of sugar in any recipe. Works in porridge, smoothies, baked goods and drinks. Raw Medjool dates are even better — blend them into smoothies or eat as a sweetener in their whole form.",i:"Babylon's sugar destroys. Jah's sweetener nourishes. The date has been feeding civilisations for 8,000 years — there is wisdom in that longevity.",ca:"Still high in sugar — those managing blood sugar should use mindfully. Buy organic, unsulphured dates only."},
{n:"Agave (Raw)",e:"",c:"sweetener",col:"#a0c060",t:"The Plant Nectar",sebi:true,form:"Nectar - Syrup",b:["Dr. Sebi's primary approved liquid sweetener","Lower glycaemic index than honey or refined sugar","Alkaline-forming — unlike most sweeteners","Contains inulin — a prebiotic that feeds beneficial gut bacteria","Neutral flavour — works in both sweet and savoury applications","Natural — extracted from the agave plant without chemical processing"],u:"Use in teas, smoothies and dressings. Use raw agave (not heated/processed) for maximum benefit. Use sparingly — sweeter than sugar so less is needed.",i:"The agave plant survives desert heat and produces nectar — sweetness born from strength and endurance.",ca:"Buy raw, unprocessed agave only — processed agave is high in fructose and can strain the liver. Use in moderation regardless."},
{n:"Raw Honey",e:"",c:"sweetener",col:"#d4a020",t:"The Living Sweetener",ital:true,form:"Raw - Ceremonial - Medicinal",b:["Contains enzymes, antioxidants, vitamins and minerals — all destroyed in processed honey","Antimicrobial — manuka honey has clinical evidence for wound healing","Natural antibiotic — used across African, Ayurvedic and Caribbean traditions","Probiotic — raw honey contains beneficial bacteria","Anti-inflammatory and soothing for the throat and respiratory tract","Prebiotic — feeds beneficial gut bacteria"],u:"Never heat raw honey above 40C — destroys the enzymes that make it medicine. Add to warm (not boiling) teas. Use Manuka (UMF 10+) for medicinal use. Buy local, raw, unpasteurised honey.",i:"Not Dr. Sebi approved (he was strictly plant-based) but deeply Ital and African in tradition. The bee is the alchemist — it creates medicine from the flowers it visits.",ca:"Not vegan — those on a strict Dr. Sebi protocol avoid honey. Not for infants under 12 months (risk of botulism). Buy raw, local, unpasteurised only."},
// SPICES AND SEASONINGS
{n:"Ginger (Fresh)",e:"",c:"spice",col:"#c8a040",t:"The Warming Root",sebi:true,ital:true,form:"Tea - Food - Juice - Tonic",b:["Gingerol — one of the most powerful anti-inflammatory compounds in the plant world","Relieves nausea, morning sickness and motion sickness — clinically proven","Digestive fire — stimulates digestive enzymes and bile","Anti-cancer — shown to target cancer stem cells in research","Reduces blood sugar and improves insulin sensitivity","Immune boosting — antiviral and antibacterial"],u:"Morning tonic: slice fresh ginger into hot water with lemon and a pinch of cayenne. Grate into stir-fries, soups and curries. Cold-press for a ginger shot. Blend into smoothies.",i:"Ginger does not whisper. It arrives, warms you from the inside, and gets to work. It is one of the most honest medicines the earth makes.",ca:"High doses may thin the blood — use cautiously before surgery. Avoid therapeutic doses in pregnancy."},
{n:"Turmeric (Raw)",e:"",c:"spice",col:"#e0a020",t:"The Golden Healer",ital:true,form:"Root - Powder - Tea - Milk",b:["Curcumin — one of the most studied anti-inflammatory compounds in nature","Matches or outperforms ibuprofen for arthritis pain in clinical trials","Anti-cancer — curcumin researched for over 12 cancer types","Supports liver detoxification and bile production","Neuroprotective — crosses the blood-brain barrier, linked to Alzheimer's prevention","Antidepressant — boosts serotonin and dopamine naturally"],u:"Golden milk: warm coconut milk with 1 tsp turmeric, black pepper, ginger and date sugar. Add to rice, stews and curries. ALWAYS combine with black pepper (piperine increases absorption by 2000%).",i:"The root that colours everything gold. In Ayurveda and Ital cooking, turmeric is not a spice — it is a daily medicine.",ca:"Not Dr. Sebi approved (he considered it hybrid). Always pair with black pepper for absorption."},
{n:"Cayenne Pepper",e:"",c:"spice",col:"#c83020",t:"The Circulatory Herb",sebi:true,ital:true,form:"Powder - Tonic - Food",b:["Capsaicin — stimulates circulation and warms every system of the body","Clears mucus from the respiratory and digestive tracts","Anti-inflammatory and analgesic — reduces pain when taken internally","Supports weight management — increases metabolism temporarily","Cardiovascular tonic — shown to reduce heart attack risk","Natural preservative — antimicrobial"],u:"Add a pinch to warm water with lemon and ginger as a morning tonic. Add to cooking at the end (heat reduces capsaicin). Start small — build up tolerance.",i:"Cayenne goes where circulation is weak and warms it back to life. The herb of fire — Dr. Sebi and Ital healers both used it to move what is stuck.",ca:"Start with very small amounts — too much causes stomach irritation. Avoid if you have active ulcers."},
{n:"Sea Salt (Natural)",e:"",c:"spice",col:"#d0d8e0",t:"The Mineral Seasoning",ital:true,form:"Seasoning - Rinse - Bath",b:["Natural sea salt contains 80+ trace minerals that table salt strips out during processing","Regulates fluid balance and blood pressure (unlike processed salt which raises it)","Essential electrolyte — sodium, potassium, magnesium and calcium together","Supports digestion — stimulates stomach acid production","Used in salt water rinses for oral health, wound healing and detox baths","Traditional Ital seasoning — unprocessed and mineral-rich"],u:"Use natural sea salt or Himalayan pink salt in cooking — not processed table salt. Use in warm water as a morning drink, mouthwash, or add to bath for a mineral soak.",i:"Not all salt is the same. Processed table salt is stripped to sodium chloride with chemicals added. Natural salt is the mineral-rich gift from the sea. The difference is everything.",ca:"Still sodium — those with high blood pressure should use mindfully even with natural salt. Use in moderation."},
{n:"Thyme",e:"",c:"spice",col:"#6a8a3a",t:"The Ital Staple Herb",ital:true,form:"Fresh - Dried - Tea",b:["Essential flavour herb of all Caribbean and Ital cooking","Powerful antimicrobial — thymol kills bacteria and viruses on contact","Supports respiratory health — used for coughs, bronchitis and chest infections","Digestive herb — reduces bloating and gas","Rich in vitamins C and K","Natural preservative in food"],u:"Add sprigs to rice and peas, stews, soups and marinades. Steep dried thyme in hot water with honey for a cough tea. Use fresh in everything — it carries the flavour of Ital cooking.",i:"Every Ital pot has thyme. It is not just flavour — it is medicine that seasons while it heals.",ca:"Generally very safe. Thyme tea in large amounts may interact with thyroid medication. Not for therapeutic doses in pregnancy."},
// OILS
{n:"Olive Oil (Extra Virgin)",e:"",c:"oil",col:"#a0a040",t:"The Sacred Oil",sebi:true,ital:true,form:"Dressing - Cooking - Finishing",b:["Dr. Sebi approved cooking oil — his most recommended fat","Rich in oleic acid — the most anti-inflammatory fatty acid","Polyphenols protect the heart and reduce oxidative stress","Reduces LDL cholesterol and raises HDL (good) cholesterol","Anti-inflammatory — reduces systemic inflammation markers","Protects the brain — linked to reduced Alzheimer's risk"],u:"Use raw as a dressing and finishing oil — drizzle over salads, grains and cooked vegetables. Use for low-to-medium heat cooking only. Never deep fry with olive oil.",i:"Pressed from the fruit of a tree that can live for thousands of years. Olive oil carries the longevity of the tree that made it.",ca:"Buy cold-pressed extra virgin only — refined olive oil has no medicinal benefit. Avoid overheating — use coconut oil for high-heat cooking instead."},
{n:"Coconut Oil",e:"",c:"oil",col:"#c8b870",t:"The All-Purpose Fat",sebi:true,ital:true,form:"Cooking - Topical - Oil Pulling",b:["Lauric acid — antimicrobial, antifungal and antiviral at a cellular level","MCT (medium chain triglycerides) — immediate energy without digestion","The Ital replacement for butter and all dairy fats","Stable at high heat — one of the safest cooking fats","Deeply moisturising for skin and hair","Supports gut health — antimicrobial against harmful bacteria"],u:"Cooking: use for medium-to-high heat. Skin: apply directly as moisturiser or hair mask. Oil pulling: 1 tbsp swished for 15-20 minutes. Always buy raw, cold-pressed, virgin coconut oil.",i:"In Ital living, coconut replaces all animal fats. The milk of the earth, not the animal.",ca:"High in saturated fat — use in moderation if managing cardiovascular disease. Buy raw cold-pressed virgin only."},
{n:"Hemp Seed Oil",e:"",c:"oil",col:"#7a9a3a",t:"The Omega Balance Oil",sebi:true,form:"Dressing - Supplement — never cook",b:["Perfect 3:1 omega-6 to omega-3 ratio — the ideal balance the human body needs","Rich in GLA (gamma-linolenic acid) — anti-inflammatory and hormone-balancing","Neuroprotective — omega-3 DHA supports brain health","Deeply moisturising for skin from within and as a topical","Rich in vitamin E — antioxidant for skin and cell protection","Dr. Sebi approved — non-hybrid, alkaline-forming"],u:"NEVER heat hemp seed oil — it oxidises and becomes harmful. Use raw only as a dressing, drizzled on salads, porridge, grains or taken as a supplement (1-2 tbsp daily).",i:"The most balanced oil in nature. It does not need to be cooked to be useful — it works best raw, just as it comes from the seed.",ca:"Refrigerate always — goes rancid within 6 weeks of opening. Do not use for cooking under any circumstances."},
// FUNCTIONAL MUSHROOMS
{n:"Turkey Tail Mushroom",e:"",c:"mushroom",col:"#8a6a3a",t:"The Immune Architect",form:"Tea - Capsule - Powder",b:["PSK (Krestin) — approved cancer treatment drug in Japan, derived from Turkey Tail","Clinically proven to improve survival rates in breast, colon and gastric cancers","Enhances the effectiveness of chemotherapy and radiation","Powerful prebiotic — restores gut microbiome after antibiotic use","Antiviral — shown to be active against HPV","Reduces inflammation throughout the body"],u:"Tea: simmer dried mushroom for 20-30 minutes. Strain and drink. Powder: add 1-2 tsp to smoothies or coffee. Capsule: 500-1000mg daily.",i:"The most clinically researched medicinal mushroom in the world. Used in Japanese hospitals. The West is late.",ca:"Generally very safe. May cause mild digestive upset initially. Consult your oncologist if using alongside cancer treatment."},
{n:"Lion's Mane",e:"",c:"mushroom",col:"#c8a040",t:"The Brain Mushroom",form:"Capsule - Powder - Tea",b:["Stimulates Nerve Growth Factor (NGF) — promotes brain cell regeneration","Shown to reduce symptoms of anxiety and depression","Improves memory, focus and cognitive function","Neuroprotective — researched for Alzheimer's and Parkinson's prevention","Supports nervous system repair after injury","Anti-inflammatory throughout the body"],u:"Powder: 1-2 tsp in morning coffee, smoothie or hot water. Capsule: 500-1000mg daily. Effects build over weeks — consistency matters more than dose.",i:"If you could only add one mushroom to your daily ritual for long-term brain health, this is it.",ca:"Avoid if you have mushroom allergies. May enhance effects of diabetes and blood-thinning medications."},
{n:"Reishi",e:"",c:"mushroom",col:"#8a3a2a",t:"The Mushroom of Immortality",form:"Tea - Capsule - Tincture",b:["Adaptogen — helps the body manage stress at a cellular level","Immune modulator — balances overactive or underactive immune response","Inhibits breast cancer cell proliferation — oestrogen receptor research","Supports deep restorative sleep","Liver protection and detoxification support","Calms the nervous system — used in TCM for Shen (spirit) cultivation"],u:"Tea: simmer dried slices for 30-60 minutes — bitter, add honey or blend with cacao. Capsule: 500-1000mg extract daily. Dual-extract tincture for maximum potency.",i:"In Chinese medicine, Reishi has been used for over 2,000 years. It was reserved for emperors. Now it belongs to everyone.",ca:"May thin the blood — stop 2 weeks before surgery. Avoid if on immunosuppressants without guidance."},
{n:"Chaga",e:"",c:"mushroom",col:"#3a2a1a",t:"The King of Mushrooms",form:"Tea - Tincture - Powder",b:["Highest antioxidant content of any natural food — ORAC score off the charts","Anti-tumour — betulinic acid shown to induce apoptosis in cancer cells","Powerful immune system activation","Reduces inflammation — cytokine regulation","Balances blood sugar and supports metabolic health","Antimicrobial and antiviral — supports immunity during illness"],u:"Tea: simmer chunks or powder in water for 20-30 minutes — taste is pleasant, slightly vanilla-like. Add to coffee as a caffeine alternative.",i:"Grows on birch trees in cold climates. Used by Siberian and Northern European indigenous communities for centuries. Rare, slow-growing and powerful — source responsibly.",ca:"High in oxalates — those with kidney stones should use cautiously. May interact with blood thinners and diabetes medication. Avoid during pregnancy."},
{n:"Shiitake",e:"",c:"mushroom",col:"#5a3a1a",t:"The Everyday Healer",form:"Food - Capsule - Tea",b:["Lentinan — a beta-glucan compound approved as a cancer treatment in Japan","Significantly lowers LDL cholesterol","Antiviral — active against influenza, HIV and hepatitis viruses in research","Rich in B vitamins, zinc and selenium","Supports immune function and reduces inflammation","The most accessible medicinal mushroom — eat it as food"],u:"Eat fresh or dried in cooking — saute in coconut oil with garlic. The most delicious medicine. Dried mushroom tea: simmer for 15-20 minutes.",i:"The bridge between the kitchen and the apothecary. You can eat your medicine without anyone knowing.",ca:"Raw shiitake can cause a skin rash in sensitive people. Always cook thoroughly."},
{n:"Cordyceps",e:"",c:"mushroom",col:"#c87a20",t:"The Energy Mushroom",form:"Capsule - Powder - Tea",b:["Increases ATP (cellular energy) production — the body's direct energy currency","Used by Chinese Olympic athletes to break world records in 1993","Supports lung capacity and oxygen uptake — endurance and performance","Adaptogen — reduces the impact of stress on the body","Supports kidney and adrenal function","Anti-inflammatory and immune-modulating"],u:"Powder: 1-2 tsp in morning coffee, smoothie or hot water. Capsule: 500-1000mg daily. Best taken in the morning — may be stimulating. Effects are cumulative — give it 2-3 weeks.",i:"The mushroom that made Chinese runners fly in 1993 — the world thought it was drugs. It was mushrooms.",ca:"May interact with blood sugar medication and immune-suppressing drugs. Avoid if pregnant. Buy Cordyceps militaris (lab-grown) for guaranteed potency."},
// TONICS
{n:"Sea Moss Gel",e:"",c:"tonic",col:"#2d5a7a",t:"The Daily Foundation",sebi:true,ital:true,form:"Gel - Drink - Smoothie additive",b:["Contains 92 of the 102 minerals the human body is made of","The single most important daily supplement in Ital and Dr. Sebi tradition","Prebiotic — coats and strengthens the gut lining","Thyroid support — rich in natural iodine","Skin, hair and joint health from within","Natural thickener — replaces eggs and gelatine in cooking"],u:"Soak raw dried sea moss for 12-24 hours, blend with spring water until smooth gel forms. Store in the fridge for up to 3 weeks. Take 1-2 tablespoons daily in smoothies, juices or teas.",i:"Every morning, before anything else. Sea moss gel is the foundation that everything else is built on in Ital living. Start here.",ca:"Source wildcrafted from clean waters — not pool-grown (pool-grown contains no minerals). Do not use if you have hyperthyroidism."},
{n:"Soursop (Fresh Juice)",e:"",c:"tonic",col:"#2d5a27",t:"The Healing Fruit",ital:true,form:"Juice - Fruit - Leaf Tea",b:["Fresh juice is the most bioavailable form of soursop medicine","Acetogenins — compounds unique to soursop shown to selectively kill cancer cells","Powerful immune system support","Antioxidant-rich — reduces oxidative stress","Anti-inflammatory and antimicrobial","Supports healthy blood pressure and blood sugar levels"],u:"Fresh juice: blend pulp with cold water, strain and drink immediately — do not heat. Eat the fruit fresh when in season. Leaf tea for more concentrated medicinal benefit.",i:"The whole plant is medicine. The fruit feeds you. The leaves treat you. The juice bridges both.",ca:"Avoid in large quantities during pregnancy. Very high doses of soursop leaf have been linked to atypical Parkinsonism — use leaf tea in moderation."},
// RECIPES
{n:"Ital Stew",e:"",c:"recipe",col:"#c87030",t:"The Foundation Meal",ital:true,form:"Recipe - Serves 4",b:["Completely plant-based — no meat, no dairy, no processed salt","High in protein from kidney beans","Rich in iron, potassium and B vitamins","Warming and deeply nourishing — a complete meal in one pot","Scotch bonnet and thyme give authentic Caribbean depth of flavour","Adapts with whatever vegetables are in season"],u:"INGREDIENTS: 400g kidney beans (soaked overnight), 2 sweet potatoes diced, 2 carrots, 1 tin coconut milk, 1 scotch bonnet (whole), 4 sprigs thyme, 3 cloves garlic, 1 onion, spring onion. METHOD: Saute onion and garlic in coconut oil. Add all vegetables and beans. Pour in coconut milk and 500ml water. Add whole scotch bonnet and thyme. Simmer 45 minutes until thick and rich. Serve over wild rice or with boiled plantain.",i:"The Ital stew does not have a fixed recipe — it has principles. Whole food, plant-based, seasoned with herbs not chemicals, cooked with love.",ca:"Ensure beans are fully cooked — undercooked kidney beans cause food poisoning. Soak overnight and boil vigorously for the first 10 minutes."},
{n:"Golden Sea Moss Tonic",e:"",c:"recipe",col:"#d4a030",t:"Dr. Sebi Morning Tonic",sebi:true,ital:true,form:"Recipe - 1 serving",b:["Dr. Sebi approved ingredients throughout","Sea moss provides the 92-mineral foundation","Turmeric and ginger are anti-inflammatory powerhouses","Alkalises the body before any food is introduced","Energising without caffeine — sustained gentle energy","Seamless delivery of nutrients first thing in the morning"],u:"INGREDIENTS: 2 tbsp sea moss gel, 1 tsp turmeric powder, 1 inch fresh ginger (grated), juice of 1 lime, 250ml coconut water, 1 tsp agave or date syrup, pinch of black pepper. METHOD: Blend all ingredients until smooth. Drink immediately on an empty stomach.",i:"Before the first bite of food, give your body minerals. This tonic is not breakfast — it is preparation.",ca:"The lime and ginger can be strong on an empty stomach — have a small amount of water first if you are sensitive."},
{n:"Alkaline Smoothie",e:"",c:"recipe",col:"#3a8a4a",t:"The Dr. Sebi Green",sebi:true,form:"Recipe - 1-2 servings",b:["100% Dr. Sebi approved ingredients","Deeply alkaline — raises body pH immediately","Complete nutrition: protein (hemp), minerals (sea moss), healthy fat (avocado)","Natural energy without caffeine","Anti-inflammatory and immune-boosting","Tastes like a treat, works like medicine"],u:"INGREDIENTS: 1 cup spring water or coconut water, 2 tbsp sea moss gel, half an avocado, 1 cup mango (frozen or fresh), handful of dandelion greens or lettuce, 3 tbsp hemp seeds, 1 tsp agave. METHOD: Blend all until completely smooth. Drink immediately.",i:"Green is the colour of life. Every ingredient in this smoothie was alive, untouched by a factory. You can taste the difference.",ca:"Use spring water or coconut water — not tap water (chlorine disrupts gut bacteria). Drink within 20 minutes of blending."},
{n:"Ital Breakfast Bowl",e:"",c:"recipe",col:"#c8a040",t:"Ital Morning Ritual",ital:true,form:"Recipe - 1 serving",b:["No eggs, no dairy, no processed foods","High in fibre, plant protein and complex carbohydrates","Tropical fruits provide vitamins and natural sugars for morning energy","Hemp seeds and sesame provide complete protein","Agave or date sugar for sustained energy — not a spike","Ready in 10 minutes"],u:"BASE: cook RED or BLACK quinoa or amaranth as porridge with coconut milk and a pinch of cinnamon. TOPPINGS: sliced mango and papaya, fresh berries, hemp seeds, sesame seeds, a drizzle of agave, a spoonful of sea moss gel. OPTIONAL: grated fresh ginger stirred through the porridge while cooking.",i:"Ital morning is slow, intentional and alive. No rush, no packet food, no compromise. What you eat first sets the tone for everything that follows.",ca:"Use frozen fruit in winter when fresh tropical fruit is unavailable."},
{n:"Callaloo and Ackee",e:"",c:"recipe",col:"#7a9a3a",t:"The Ital Classic",ital:true,form:"Recipe - Serves 2",b:["Quintessential Jamaican Ital breakfast — completely plant-based","High in iron (callaloo), plant fat and protein (ackee)","Complete meal — protein, fat and greens in one pan","Scotch bonnet, thyme and spring onion — the flavour foundation of Ital cooking","Can be served with boiled plantain, breadfruit or spelt flatbread","Ready in 20 minutes"],u:"INGREDIENTS: 1 tin ackee (drained), 1 bunch callaloo (or substitute spinach), 1 onion, 3 spring onions, 2 cloves garlic, half scotch bonnet (seeded for less heat), 3 sprigs thyme, coconut oil, black pepper. METHOD: Saute onion, garlic and scotch bonnet in coconut oil. Add callaloo and wilt. Gently fold in ackee (it breaks easily). Season with thyme and black pepper. Serve immediately.",i:"This dish has fed Caribbean people for generations as a morning meal. Simple, quick, deeply nourishing and irreplaceable.",ca:"Ackee MUST be fully ripe and cooked — tinned is safe. Handle ackee gently — it falls apart easily."},
{n:"Evening Herb Tea Blend",e:"",c:"recipe",col:"#6a8a4a",t:"The Evening Medicine",sebi:true,ital:true,form:"Recipe - 1 serving",b:["Combines Dr. Sebi approved herbs for a full-body evening tonic","Dandelion and burdock clean the blood and liver","Chamomile calms the nervous system for sleep","Ginger aids digestion of the day's food","Elderflower supports the immune system","Completely caffeine-free — safe to drink before sleep"],u:"BLEND: 1 tsp dried dandelion root, 1 tsp dried burdock root, 1 tsp chamomile flowers, half tsp dried ginger, 1 tsp elderflower. Steep in just-boiled water for 10-15 minutes. Strain well. Sweeten with agave or date syrup.",i:"In Ital living, the evening is for releasing what the day brought. This blend helps the body do its overnight work — cleansing, repairing, restoring. Do not rush it.",ca:"Do not boil the flowers — pour over just-boiled water and cover while steeping."}
];
var kitchenCats={all:{l:"All",col:"#8a7a5a"},recipe:{l:"Recipes",col:"#c87030"},ital:{l:"Ital",col:"#3a8a4a"},grain:{l:"Grains",col:"#c8a040"},fruit:{l:"Fruit",col:"#e0a020"},nuts:{l:"Nuts & Seeds",col:"#8a6a3a"},spice:{l:"Spices & Seasonings",col:"#c8732a"},sweetener:{l:"Sweeteners",col:"#8a5020"},oil:{l:"Oils",col:"#a0a040"},mushroom:{l:"Functional Mushrooms",col:"#8a6a3a"},tonic:{l:"Tonics & Foundation",col:"#2d5a7a"}};

var teeth=[
{n:"Myrrh Gum",e:"",c:"drsebi",col:"#c8a040",t:"The Gum Healer",sebi:true,b:["Dr. Sebi's #1 oral herb — core ingredient in his official Tooth Powder","Powerful antiseptic — kills bacteria that cause decay and gum disease","Anti-inflammatory — reduces gum soreness, swelling and bleeding","Speeds repair of mouth ulcers, cuts and chapped lips","Eliminates bad breath with sweet-smelling antimicrobial compounds","Traditionally used across Africa and the Middle East for oral and spiritual ritual"],u:"As tooth powder: mix with Encino and Cuachalalate, apply to a wet toothbrush and brush gently. As a rinse: steep 1 tsp in boiling water for 10 minutes, cool and use as a mouthwash.",i:"Burned in temples and used in sacred rites for thousands of years — myrrh purifies not just the mouth but the space around you. Ancient Egyptian, Rastafarian and Islamic traditions all hold it sacred.",ca:"Do not ingest the essential oil form. Avoid high doses in pregnancy."},
{n:"Encino (Oak Bark)",e:"",c:"drsebi",col:"#8B4513",t:"The Gum Tightener",sebi:true,b:["Dr. Sebi's tooth powder ingredient — his specific choice for gum strength","Rich in tannins — astringent compounds that tighten and tone gum tissue","Tightens tooth sockets — helps retain teeth into old age","Reduces gum inflammation and bleeding","Antibacterial against the bacteria responsible for plaque and decay","Promotes gum regeneration and tissue healing"],u:"As powder: combine with myrrh and cuachalalate for Dr. Sebi's tooth powder formula. As a rinse: steep 1 tsp dried bark in boiling water for 15 minutes, strain well, cool and rinse. Do not swallow.",i:"The oak has been medicine for millennia — its bark holds the same strength that lets the tree stand for hundreds of years.",ca:"Do not swallow in large amounts — high tannin content can irritate the stomach. External and rinse use only."},
{n:"Cuachalalate",e:"",c:"drsebi",col:"#a05020",t:"The Cell Rejuvenator",sebi:true,b:["Third pillar of Dr. Sebi's tooth powder — the rejuvenation herb","Anti-inflammatory — reduces gum inflammation at a cellular level","Promotes regeneration of the cells lining the mouth","Strengthens gum tissue from within","Traditionally used in Mexican and Central American herbal medicine","Antimicrobial — reduces harmful bacteria in the mouth"],u:"As part of the tooth powder blend with myrrh and encino. As a rinse: steep bark in hot water for 15 minutes, cool and rinse. Widely available as a tea in Latin herbal stores.",i:"A traditional Mesoamerican healing bark — the same plant cultures that gave us ceremonial cacao also gave us cuachalalate.",ca:"Generally very safe for oral use. Avoid swallowing large amounts."},
{n:"Cloves",e:"",c:"pain",col:"#6B3A2A",t:"The Tooth Pain Herb",b:["Eugenol — the compound in cloves is the basis of dental anaesthetic worldwide","Kills bacteria responsible for tooth decay and gum disease","Instant relief for toothache when applied directly to the affected area","Anti-inflammatory — reduces swelling in gums and jaw","Powerful antifungal — addresses oral candida","Fresh breath — natural antimicrobial that eliminates odour at the source"],u:"For tooth pain: press a whole clove against the aching tooth or gum. Or dilute 1-2 drops of clove oil in coconut oil and apply with a cotton ball. As mouthwash: steep 4-6 cloves in boiling water for 10 minutes, cool and rinse.",i:"Every dentist's surgery smells of eugenol — cloves. The plant world gave us anaesthesia long before the laboratory did.",ca:"Clove oil is very concentrated — never apply undiluted directly to gums as it can cause burns. Avoid large amounts in pregnancy."},
{n:"Neem (Oral Use)",e:"",c:"antibacterial",col:"#3d6b2a",t:"The Original Toothbrush",b:["Used as a toothbrush (chew stick) across Africa, India and the Middle East for millennia","Powerful antibacterial — inhibits Streptococcus mutans responsible for cavities","Reduces plaque formation and gingivitis","Antifungal — eliminates oral candida overgrowth","Reduces gum inflammation and bleeding","Alkalises the mouth — changes pH to prevent bacterial growth"],u:"Chew stick method: use a fresh neem twig, chew one end until brush-like, then brush teeth and gums. As a rinse: steep 5-7 leaves in boiling water for 10 minutes, cool and rinse.",i:"Before the toothbrush existed, neem was it. Every civilisation that had access to this tree used it for oral care.",ca:"Bitter taste takes getting used to. Internal consumption of neem oil is toxic — oral rinse and chew stick use only."},
{n:"Oil Pulling (Coconut Oil)",e:"",c:"cleanse",col:"#c8b870",t:"The Ancient Mouth Cleanse",b:["Ayurvedic practice — 3,000 years of oral health tradition","Pulls bacteria, toxins and debris from between teeth and gum pockets","Reduces Streptococcus mutans — the primary bacteria causing tooth decay","Reduces plaque and gingivitis — backed by multiple clinical studies","Whitens teeth naturally over time","Freshens breath by removing odour-causing bacteria at the root"],u:"Take 1 tablespoon of coconut oil. Swish and pull through teeth for 15-20 minutes first thing in the morning on an empty stomach. Do not swallow — spit into the bin. Rinse with warm salt water after.",i:"Every morning before you eat or drink — the oil becomes a white emulsion filled with what was living in your mouth overnight. It is humbling and purifying in equal measure.",ca:"Do not swallow the oil. Start with 5 minutes if 20 feels too long. Never replace brushing with oil pulling — it works alongside, not instead."},
{n:"Activated Charcoal",e:"",c:"whitening",col:"#2a2a2a",t:"The Natural Whitener",b:["Highly porous surface binds to surface stains — coffee, tea, red wine, plaque","Natural teeth whitening without harsh chemical bleaching agents","Antibacterial — absorbs the bacteria and toxins that cause bad breath","Removes surface tartar build-up when used consistently","Detoxifying — draws impurities from gum tissue","No fluoride, no synthetic abrasives"],u:"Apply a small amount to a wet toothbrush. Brush very gently for 2 minutes. Rinse thoroughly. Use 2-3 times per week maximum — not as a daily toothpaste.",i:"Black as night, leaves teeth white — activated charcoal is one of those things that looks alarming and works quietly. Trust the process.",ca:"Use sparingly — too frequent use can wear enamel over time. Not suitable for those with crowns, veneers or caps."},
{n:"Salt Water Rinse",e:"",c:"cleanse",col:"#a0c0d0",t:"The Oldest Rinse",b:["Alkalises the mouth — bacteria cannot survive in alkaline environments","Draws fluid from infected or swollen gum tissue — reduces swelling","Disrupts biofilm (plaque) without chemical intervention","Speeds healing after tooth extraction, ulcers or gum cuts","Antifungal — disrupts oral candida growth","Free, effective, zero side effects — used across every civilisation"],u:"Dissolve half a teaspoon of natural sea salt in a glass of warm water. Rinse for 30-60 seconds. Spit. Use 2-3 times daily when dealing with infection or after dental work.",i:"The simplest medicine is the sea. Salt water rinse is what healers recommended before there were healers. It still works better than most things in the dental aisle.",ca:"Use natural sea salt or Himalayan salt — not processed table salt. Do not swallow."},
{n:"Oregano Oil",e:"",c:"antibacterial",col:"#5a7a2a",t:"The Oral Antibiotic",b:["Carvacrol — one of the most powerful natural antimicrobials known","Kills bacteria, viruses and fungi in the mouth simultaneously","Effective against drug-resistant bacteria including MRSA","Reduces gum infection and inflammation rapidly","Helps with dental abscesses when used as a targeted application","Anti-biofilm — disrupts the protective coating bacteria form on teeth"],u:"Dilute 1-2 drops in a tablespoon of coconut oil and swish for 5-10 minutes. Or dilute in water and use as a mouthwash. Never apply undiluted. Use for acute infections for 5-7 days.",i:"Carvacrol does not care whether bacteria have become antibiotic resistant — it uses a completely different mechanism. Nature does not create drug resistance.",ca:"Never use undiluted — causes burns to sensitive oral tissue. Avoid in pregnancy. Not for long-term daily use."}
];
var teethCats={all:{l:"All",col:"#8a7a5a"},drsebi:{l:"Dr.Sebi",col:"#2E8B57"},pain:{l:"Tooth Pain",col:"#6B3A2A"},antibacterial:{l:"Antibacterial",col:"#3d6b2a"},cleanse:{l:"Cleanse & Rinse",col:"#a0c0d0"},whitening:{l:"Whitening",col:"#c8b870"}};
var boards=[
{id:"herbs",   label:"Herbalism",      desc:"Teas, leaves, roots and bark. Everyday plant healing. Includes Dr.Fire protocol herbs and all Dr. Sebi approved herbs."},
{id:"oils",    label:"Aromatherapy",   desc:"Essential oils for healing, mood, space and ritual. The olfactory path to the nervous system."},
{id:"plants",  label:"Plant Medicine", desc:"Sacred plants used ceremonially, with intention and respect. Kambo, Rapeh, Sananga and more."},
{id:"kitchen", label:"Living Kitchen", desc:"Dr.Sebi approved foods, Ital staples, grains, nuts, seeds, mushrooms, oils and recipes. The kitchen as apothecary."},
{id:"teeth",   label:"Teeth & Oral",   desc:"Dr.Sebi tooth powder herbs — myrrh, encino, cuachalalate — and natural oral care practices."},
{id:"wisdom",  label:"Wisdom",         desc:"The philosophy behind the practice. What is Ital? Who is Dr. Sebi? What is the difference? Why does any of this matter?"}
];
var currentBoard="herbs";var currentCat="all";
function getData(){if(currentBoard==="herbs")return{items:herbs,cats:herbCats};if(currentBoard==="oils")return{items:oils,cats:oilCats};if(currentBoard==="plants")return{items:plants,cats:plantCats};if(currentBoard==="kitchen")return{items:kitchen,cats:kitchenCats};if(currentBoard==="teeth")return{items:teeth,cats:teethCats};return{items:[],cats:{}};}
function getItems(){var d=getData();if(currentCat==="all")return d.items;if(currentCat==="drfire")return d.items.filter(function(x){return x.fire;});if(currentCat==="drsebi")return d.items.filter(function(x){return x.sebi||x.c==="drsebi";});if(currentCat==="ital")return d.items.filter(function(x){return x.ital||x.c==="ital";});return d.items.filter(function(x){return x.c===currentCat;});}
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function hdrHtml(){return'<div style="margin-bottom:2rem"><p class="hdr-label">Personal Reference</p><h1 class="hdr-title">The <em>Apothecary</em></h1><p class="hdr-sub">Herbalism — Aromatherapy — Plant Medicine — Living Kitchen — Oral Care — Wisdom</p><div class="hdr-links"><a class="hdr-link" href="citations.html">Sources & Citations</a><a class="hdr-link" href="knowledge.html">Knowledge Page</a></div></div>';}
function boardBtnsHtml(){return'<div class="boards">'+boards.map(function(b){return'<button class="board-btn'+(b.id===currentBoard?' active':'')+'" onclick="setBoard(\''+b.id+'\')">'+(b.id==='wisdom'?'📖 ':'')+b.label+'</button>';}).join('')+'</div>';}

function wBullet(col,text){return'<li class="w-bullet" style="color:#c8b890;list-style:none"><span style="color:'+col+';position:absolute;left:0">✦</span>'+text+'</li>';}
function wSection(title,col,content){return'<div class="w-section"><div class="w-title" style="color:'+col+';border-bottom-color:'+col+'30">'+title+'</div><div class="w-body">'+content+'</div></div>';}
function compBox(col,title,items){return'<div class="comp-box" style="background:'+col+'0a;border:1px solid '+col+'30"><div class="comp-title" style="color:'+col+'">'+title+'</div>'+items.map(function(t){return'<div class="comp-item" style="color:#a09070"><span style="color:'+col+';position:absolute;left:0">·</span>'+t+'</div>';}).join('')+'</div>';}

function renderWisdom(){
  document.getElementById('root').innerHTML='<div class="wrap">'+hdrHtml()+boardBtnsHtml()
  +'<div class="board-desc">The philosophy behind the practice. Understanding where this knowledge comes from and why it matters.</div>'
  +'<div style="max-width:780px">'
  +wSection("What is Ital?","#3a8a4a",
    'The word <strong style="color:#e8dcc8">Ital</strong> comes from the word <em>vital</em> — with the initial "v" removed. In Rastafari livity, the letter "I" is sacred, signifying the unity of the self with Jah (God) and with all creation. Ital is therefore not just a diet. It is a way of living that honours the life force in everything.<br><br>'
    +'<strong style="color:#7ada9a">The core principles of Ital living:</strong><br><br>'
    +'<ul style="padding-left:1.2rem;margin:0">'
    +wBullet("#7ada9a","Whole and natural food — nothing processed, nothing from a factory, nothing with chemicals")
    +wBullet("#7ada9a","Plant-based — no flesh, no blood. What is alive should not be ended to feed you when the earth provides abundantly")
    +wBullet("#7ada9a","No added salt (traditionally) — herbs and natural flavours only. Some practitioners use natural sea salt")
    +wBullet("#7ada9a","No alcohol — Babylon's drug of compliance. Ganja (where part of one's livity) is the Ital alternative")
    +wBullet("#7ada9a","Food prepared with intention and love — the energy of the cook goes into the food")
    +wBullet("#7ada9a","Living food where possible — fruits, plants, seeds in their natural state carry more life force than cooked food")
    +wBullet("#7ada9a","Seasonal, local and earth-connected — if it does not grow from the ground, question it")
    +'</ul><br>'
    +'Ital is not a rigid rulebook. Different mansions of Rastafari (Bobo Ashanti, Nyabinghi, Twelve Tribes) have different interpretations. The Bobo Ashanti are the strictest — fully vegan, no salt. The Twelve Tribes allow some flexibility. What is consistent across all is the principle: <em>food is medicine, food is spiritual, food connects you to Jah and to the earth.</em>'
  )
  +wSection("Who is Dr. Sebi?","#2E8B57",
    '<strong style="color:#e8dcc8">Dr. Sebi</strong> (born Alfredo Bowman, November 26, 1933 — died August 6, 2016) was born in Ilanga, Honduras. He was a self-taught pathologist, herbalist, biochemist and naturalist who studied herbs across America, Latin America, Africa and the Caribbean for over 30 years.<br><br>'
    +'He came to the United States diagnosed with asthma, diabetes, impotency and obesity. After being failed by conventional medicine, he was led to an herbalist in Mexico. He healed himself completely. From that experience, he dedicated his life to developing a system of healing he called the <strong style="color:#5aaa7a">African Bio-Mineral Balance</strong>.<br><br>'
    +'<strong style="color:#5aaa7a">In 1988</strong>, Dr. Sebi was brought to trial in New York after claiming to cure AIDS, cancer, lupus and other diseases. He arrived in court with 77 patients whose files confirmed his claims. The case was dismissed. This is one of the most important moments in modern herbal history — a self-taught Black herbalist from Honduras vindicated in a New York court against the medical establishment.<br><br>'
    +'He founded the <strong style="color:#5aaa7a">USHA Research Institute</strong> in Honduras, where he treated patients from around the world. He died in police custody in Honduras in 2016 — the circumstances remain disputed and are considered suspicious by those who knew his work.'
  )
  +wSection("The African Bio-Mineral Balance","#2E8B57",
    'Dr. Sebi\'s theory is built on one central idea: <em>all disease has one cause — mucus and acidity in the body.</em><br><br>'
    +'<strong style="color:#5aaa7a">The four pillars:</strong><br><br>'
    +'<ul style="padding-left:1.2rem;margin:0">'
    +wBullet("#5aaa7a","<strong>Alkaline only</strong> — the body\'s natural state is alkaline (pH above 7). Disease thrives in acid. Every food and herb approved by Dr. Sebi is alkaline-forming")
    +wBullet("#5aaa7a","<strong>Non-hybrid plants only</strong> — modern agriculture has crossbred most plants into forms that do not occur in nature. Dr. Sebi believed hybrid plants are incomplete and acid-forming")
    +wBullet("#5aaa7a","<strong>Natural minerals in organic form only</strong> — the body can only absorb minerals from plant sources. Inorganic supplements (most commercial vitamins) are rejected by the body")
    +wBullet("#5aaa7a","<strong>Cellular cleansing and revitalisation</strong> — healing happens at the intra-cellular level. The herbs and foods clean the cells. The minerals rebuild them")
    +'</ul><br>'
    +'<strong style="color:#5aaa7a">What Dr. Sebi rejected:</strong> garlic (hybrid), turmeric (he considered it hybrid — note: some practitioners disagree), white rice, all dairy, all meat, all alcohol, all hybrid grains, all commercial supplements, seedless fruit.'
  )
  +wSection("Ital vs. Dr. Sebi — The Difference","#c8732a",
    'They overlap significantly but they are not the same thing.<br><br>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0">'
    +compBox("#3a8a4a","Ital",["Rastafari spiritual practice","Caribbean in origin — African roots","Spiritual philosophy first, diet second","About honouring Jah through food","No fixed list of approved foods","Includes plantain, callaloo, ackee, breadfruit — all Caribbean staples","Traditional — passed through community and practice","May include natural sea salt","Community-based — the table is shared"])
    +compBox("#2E8B57","Dr. Sebi",["Herbalist scientific-spiritual framework","Honduran / African diaspora origin","Biochemical theory of cellular healing","About restoring cellular function through alkalinity","Strict approved food and herb list","Excludes garlic, turmeric, carrots, seedless fruit — all considered hybrid","Documented — published nutritional guide","Explicitly rejects all hybrid plants","Rejects all salt (uses herbs instead)","Individual healing protocol"])
    +'</div>'
    +'<strong style="color:#e8dcc8">Where they meet:</strong> Both reject processed food. Both reject animal products. Both use plants as medicine. Both are rooted in African healing wisdom. Both understand food as spiritual and political — not just nutritional. Many people who follow one also honour the other. They are complementary, not contradictory.<br><br>'
    +'<em style="color:#8a7a5a">Items marked <span style="background:rgba(58,180,90,0.12);color:#7ada9a;padding:1px 5px;border-radius:2px;font-family:monospace;font-size:0.7rem">Ital</span> belong to the Rastafari tradition. Items marked <span style="background:rgba(46,139,87,0.15);color:#5aaa7a;padding:1px 5px;border-radius:2px;font-family:monospace;font-size:0.7rem">Dr.Sebi</span> are on his approved list. Many items carry both.</em>'
  )
  +wSection("Why Practice This Lifestyle?","#c8b890",
    'The honest answer is not about trends, wellness culture or aesthetics. It is about something older.<br><br>'
    +'<strong style="color:#e8dcc8">The body knows.</strong> Before pharmaceutical intervention, before food processing, before the industrialisation of agriculture, human beings ate from the earth and used plants to heal. That knowledge was systematically erased: through colonisation, through the criminalisation of indigenous medicine, through the corporate capture of healthcare, through the economic incentivisation of keeping people ill rather than healing them.<br><br>'
    +'Ital living and the African Bio-Mineral Balance are acts of <strong style="color:#c8b890">reclamation</strong>. They say: this knowledge belongs to us. It was always ours. And the evidence — in journals, in clinical trials, in the lives of people who practice — keeps confirming what the healers always knew.<br><br>'
    +'<ul style="padding-left:1.2rem;margin:0">'
    +wBullet("#c8b890","Reduce inflammation — the root cause of most chronic disease, from heart disease to cancer to diabetes to autoimmune conditions")
    +wBullet("#c8b890","Alkalise the body — create an internal environment where disease cannot thrive")
    +wBullet("#c8b890","Cleanse the blood and organs — the liver, kidneys, colon and lymphatic system do their best work when not overloaded with processed food and animal products")
    +wBullet("#c8b890","Rebuild the gut — the gut microbiome is the second brain. It governs immunity, mood, energy and cognition")
    +wBullet("#c8b890","Reconnect with the earth — the food grown in soil, the herbs in the earth, the minerals in the sea — this is the original pharmacy")
    +wBullet("#c8b890","Claim sovereignty over your health — do not outsource your wellbeing entirely to a system that profits from your illness")
    +'</ul>'
  )
  +'<a href="citations.html" style="display:inline-block;margin-top:2rem;font-family:monospace;font-size:0.6rem;letter-spacing:0.15em;color:#5a4a3a;text-decoration:none;border:1px solid rgba(232,220,200,0.08);padding:6px 14px;border-radius:3px">View Full Sources & Citations</a>'
  +'</div></div>';
}

function render(){
  if(currentBoard==="wisdom"){renderWisdom();return;}
  var board=boards.filter(function(b){return b.id===currentBoard;})[0];
  var d=getData();
  var items=getItems();
  var filterHtml="";
  for(var k in d.cats){var v=d.cats[k];var active=k===currentCat;filterHtml+='<button class="filter-btn'+(active?' active':'')+'" style="'+(active?'border-color:'+v.col+';background:'+v.col+'22;color:#e8dcc8':'border-color:rgba(232,184,75,0.1)')+'" onclick="setCat(\''+k+'\')">'+(k==='drfire'?'🔥 ':k==='drsebi'?'🌿 ':k==='ital'?'🌱 ':'')+v.l+'</button>';}
  var cardsHtml="";
  for(var i=0;i<items.length;i++){var item=items[i];var badges="";if(item.fire)badges+='<span class="badge badge-fire">🔥 Dr.Fire</span>';if(item.sebi||item.c==="drsebi")badges+='<span class="badge badge-sebi">🌿 Dr.Sebi</span>';if(item.ital||item.c==="ital")badges+='<span class="badge badge-ital">🌱 Ital</span>';var badgeDiv=badges?'<div class="card-badges">'+badges+'</div>':'';var tagText=item.fire?item.fire.role:item.t;var meta=item.method||item.form||item.trad||"";var metaHtml=meta?'<p class="meta-tag">'+esc(meta)+'</p>':'';cardsHtml+='<div class="card" onclick="openModal('+i+')" style="border-color:'+item.col+'22" onmouseenter="this.style.background=\''+item.col+'18\';this.style.borderColor=\''+item.col+'66\';this.style.transform=\'translateY(-2px)\'" onmouseleave="this.style.background=\'rgba(255,255,255,0.02)\';this.style.borderColor=\''+item.col+'22\';this.style.transform=\'none\'">'+
    '<div class="card-dot" style="background:'+item.col+'"></div>'+badgeDiv+
    '<span class="card-emoji">'+item.e+'</span>'+
    '<p class="card-name">'+esc(item.n)+'</p>'+
    '<p class="card-tag" style="color:'+item.col+'">'+esc(tagText)+'</p>'+
    metaHtml+'<p class="card-tap">TAP TO OPEN</p></div>';}
  document.getElementById('root').innerHTML='<div class="wrap">'+hdrHtml()+boardBtnsHtml()+
    '<div class="board-desc">'+esc(board.desc)+'</div>'+
    '<div class="filters">'+filterHtml+'</div>'+
    '<div class="grid">'+cardsHtml+'</div></div>';
  window._items=items;
}

function setBoard(id){currentBoard=id;currentCat="all";render();}
function setCat(cat){currentCat=cat;render();}

function openModal(idx){
  var item=window._items[idx];if(!item)return;
  document.getElementById('m-emoji').textContent=item.e||"";
  document.getElementById('m-name').textContent=item.n;
  document.getElementById('m-tagline').textContent=item.t;
  document.getElementById('m-tagline').style.color=item.col;
  var badges="";
  if(item.fire)badges+='<span class="modal-badge badge-fire">🔥 Dr.Fire Protocol</span>';
  if(item.sebi||item.c==="drsebi")badges+='<span class="modal-badge badge-sebi">🌿 Dr.Sebi Approved</span>';
  if(item.ital||item.c==="ital")badges+='<span class="modal-badge badge-ital">🌱 Ital</span>';
  document.getElementById('m-badges').innerHTML=badges;
  var fb=document.getElementById('m-firebox');
  if(item.fire){fb.style.display="block";document.getElementById('m-firetitle').textContent="Dr.Fire — "+item.fire.role;document.getElementById('m-firetext').textContent=item.fire.p;document.getElementById('m-firefreq').textContent="FREQUENCY: "+item.fire.f;}else{fb.style.display="none";}
  var ib=document.getElementById('m-italbox');var noteText=item.i||"";
  if(noteText){ib.style.display="block";ib.style.borderLeftColor=item.col;ib.style.background=item.col+"18";document.getElementById('m-ital').textContent=noteText;}else{ib.style.display="none";}
  var trad=document.getElementById('m-tradition');var meta=item.trad||item.method||item.form||"";
  if(meta){trad.style.display="block";trad.textContent=meta;}else{trad.style.display="none";}
  document.getElementById('m-bsec').style.color=item.col;
  var bHtml="";for(var i=0;i<item.b.length;i++)bHtml+='<li>'+esc(item.b[i])+'</li>';
  document.getElementById('m-benefits').innerHTML=bHtml;
  document.getElementById('m-usage').textContent=item.u;
  document.getElementById('m-caution').textContent=item.ca;
  document.getElementById('modal-box').style.borderColor=item.col+"55";
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('modal-close').addEventListener('click',closeModal);
render();
</script>
