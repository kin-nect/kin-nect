<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Apothecary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0d0a06;color:#e8dcc8;font-family:Georgia,serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0d0a06}::-webkit-scrollbar-thumb{background:#3a3020;border-radius:3px}
button{cursor:pointer;font-family:inherit}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}
.hdr-label{font-family:monospace;font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;color:#c8732a;margin-bottom:0.5rem}
.hdr-title{font-size:2.6rem;font-weight:400;color:#e8dcc8;margin-bottom:0.5rem}
.hdr-title em{color:#c8732a;font-style:italic}
.hdr-sub{font-size:1.1rem;color:#c8b890;font-style:italic;letter-spacing:0.03em;margin-bottom:0.75rem}
.hdr-links{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:2rem}
.hdr-link{font-family:monospace;font-size:0.6rem;letter-spacing:0.12em;color:#5a4a3a;text-decoration:none;border:1px solid rgba(232,220,200,0.08);padding:4px 10px;border-radius:3px}
.hdr-link:hover{color:#c8732a;border-color:rgba(200,115,42,0.3)}
.boards{display:grid;grid-template-columns:repeat(6,1fr);gap:0.4rem;margin-bottom:0.75rem}
.board-btn{padding:0.7rem 0.4rem;background:rgba(255,255,255,0.02);border:1px solid rgba(232,220,200,0.1);border-radius:6px;color:#a09080;font-size:0.85rem;text-align:center;transition:all 0.15s}
.board-btn.active{background:rgba(200,115,42,0.12);border-color:rgba(200,115,42,0.5);color:#c8732a}
.board-desc{padding:0.75rem 1rem;background:rgba(200,115,42,0.04);border:1px solid rgba(200,115,42,0.08);border-radius:6px;margin-bottom:1.5rem;font-style:italic;font-size:1rem;color:#a09070;line-height:1.6}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.filter-btn{padding:5px 14px;border:1px solid rgba(232,184,75,0.1);border-radius:2rem;background:transparent;color:#5a4a3a;font-size:0.88rem;transition:all 0.15s}
.filter-btn.active{color:#e8dcc8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:1rem}
.card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:1.25rem;cursor:pointer;transition:all 0.2s;position:relative}
.card:hover{transform:translateY(-2px)}
.card-dot{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;opacity:0.7}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-family:monospace;font-size:0.58rem;letter-spacing:0.04em;padding:2px 5px;border-radius:2px}
.badge-fire{background:rgba(46,139,87,0.15);color:#5aaa7a;border:1px solid rgba(46,139,87,0.3)}
.badge-sebi{background:rgba(46,139,87,0.15);color:#5aaa7a;border:1px solid rgba(46,139,87,0.3)}
.badge-ital{background:rgba(58,180,90,0.12);color:#7ada9a;border:1px solid rgba(58,180,90,0.3)}
.card-emoji{font-size:1.8rem;display:block;margin-bottom:8px}
.card-name{font-size:0.95rem;color:#e8dcc8;margin-bottom:3px}
.card-tag{font-size:0.82rem;font-style:italic;margin-bottom:8px}
.card-tap{font-family:monospace;font-size:0.58rem;letter-spacing:0.08em;color:#6a5a4a;margin-top:6px}
.meta-tag{font-family:monospace;font-size:0.56rem;color:#5a4a3a;letter-spacing:0.05em;margin-bottom:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal-box{background:#131008;border-radius:6px;padding:2rem;max-width:540px;width:100%;max-height:82vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#5a4a3a;font-size:1.5rem;line-height:1}
.modal-emoji{font-size:2.5rem;display:block;margin-bottom:10px}
.modal-name{font-size:1.7rem;color:#e8dcc8;font-weight:400;margin:0 0 3px}
.modal-tagline{font-style:italic;font-size:0.9rem;margin:0 0 0.75rem}
.modal-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.modal-badge{font-family:monospace;font-size:0.58rem;letter-spacing:0.06em;padding:3px 8px;border-radius:3px}
.fire-box{background:rgba(46,139,87,0.06);border:1px solid rgba(46,139,87,0.25);border-radius:4px;padding:12px 14px;margin-bottom:1.25rem}
.fire-box-title{font-family:monospace;font-size:0.58rem;letter-spacing:0.12em;color:#5aaa7a;text-transform:uppercase;margin-bottom:6px}
.fire-box-text{font-size:0.9rem;color:#a0d4b0;line-height:1.6;margin-bottom:6px}
.fire-box-freq{font-family:monospace;font-size:0.58rem;letter-spacing:0.08em;color:#5a8a6a}
.ital-box{border-left:3px solid;padding:10px 14px;border-radius:0 4px 4px 0;margin-bottom:1.25rem}
.ital-text{font-style:italic;font-size:0.88rem;color:#c8b890;line-height:1.6}
.modal-sec{font-family:monospace;font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;margin:0 0 8px}
.modal-list{list-style:none;padding:0;margin:0 0 1.25rem}
.modal-list li{font-size:0.88rem;color:#c8b890;padding:3px 0 3px 16px;position:relative;line-height:1.5}
.modal-list li::before{content:"*";position:absolute;left:0;color:#c8732a}
.modal-usage{font-size:0.88rem;color:#c8b890;line-height:1.7;margin:0 0 1.25rem}
.caution-box{background:rgba(180,50,30,0.08);border:1px solid rgba(180,50,30,0.2);border-radius:4px;padding:10px 12px}
.caution-text{font-size:0.82rem;color:#a06050;line-height:1.5}
.w-section{margin-bottom:2.5rem}
.w-title{font-family:monospace;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.75rem;border-bottom-width:1px;border-bottom-style:solid;padding-bottom:0.5rem}
.w-body{font-size:0.9rem;color:#c8b890;line-height:1.85}
.w-bullet{padding:4px 0 4px 18px;position:relative}
.w-bullet::before{content:"✦";position:absolute;left:0}
.comp-box{border-radius:6px;padding:1rem}
.comp-title{font-family:monospace;font-size:0.6rem;letter-spacing:0.15em;margin-bottom:0.75rem}
.comp-item{font-size:0.82rem;color:#a09070;padding:3px 0 3px 14px;position:relative}
.comp-item::before{content:"·";position:absolute;left:0}
@media(max-width:700px){.boards{grid-template-columns:repeat(3,1fr)}.hdr-title{font-size:2rem}}
@media(max-width:400px){.boards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

var herbs=[
{n:"Soursop Leaf",e:"",c:"cancer",col:"#2d5a27",t:"The Cancer Fighter",sebi:true,b:["Potent anti-cancer — acetogenins inhibit abnormal cell growth","Antioxidant-rich, combating oxidative stress","Supports immune system strength","Calms the nervous system — aids sleep and anxiety","Antimicrobial and antifungal","Supports healthy blood pressure"],u:"Steep 3-5 dried leaves in boiling water for 10-15 minutes. Drink 1-2 cups daily. Best in the evening.",i:"Sacred in Ital healing — one of the most powerful leaves the Most High placed on Earth for bodily restoration.",ca:"Avoid in pregnancy. Do not combine with blood pressure medication without guidance."},
{n:"Elderflower",e:"",c:"healing",col:"#b8a96a",t:"The Immune Blossom",sebi:true,b:["Powerful immune booster — colds and flu","Natural antihistamine — relieves hay fever","Anti-inflammatory, supports sinus health","Rich in Vitamin C and flavonoids","Gentle detoxifying and diuretic","Promotes healthy skin from within"],u:"Steep 1-2 tsp dried flowers in hot (not boiling) water for 5-7 minutes. Drink 2-3 cups during cold season.",i:"The elder tree was revered across many cultures as sacred — a bridge between earthly and spiritual medicine.",ca:"Use flowers only — elderberries and raw bark can be toxic."},
{n:"Chamomile",e:"",c:"calm",col:"#d4a853",t:"The Gentle Healer",sebi:true,b:["Powerful sleep aid — reduces insomnia","Reduces anxiety and stress naturally","Anti-inflammatory — soothes gut and IBS","Antispasmodic — relieves menstrual cramps","Supports skin health internally","Gentle enough for children"],u:"Steep 1 heaped tsp in boiling water for 5-10 minutes. Drink before bed or when anxious. Add raw honey and lemon.",i:"One of Jah's most gentle medicines — for when the body and mind need to be held, not pushed.",ca:"Allergy possible if sensitive to ragweed family."},
{n:"Raspberry Leaf",e:"",c:"woman",col:"#8b3a52",t:"The Womb Tonic",sebi:true,b:["Tones and strengthens uterine muscles","Eases painful menstruation","Rich in iron, calcium, magnesium and B vitamins","Traditionally used in late pregnancy to prepare the womb","Balances hormones naturally","Supports milk production when breastfeeding"],u:"Steep 1-2 tsp in boiling water for 10 minutes. Drink 1-3 cups daily. Especially powerful in the week before menstruation.",i:"A gift from Jah specifically for the Empress — honouring the sacred creative power of the womb.",ca:"Avoid in early pregnancy. Consult a midwife before use in late pregnancy."},
{n:"Hibiscus (Sorrel)",e:"",c:"heart",col:"#b5294e",t:"The Blood Cleanser",fire:{role:"The Blood",p:"Dr.Fire's blood cleaner. Do NOT boil — cold or warm water infusion only. Heat destroys the active compounds needed to cleanse the bloodstream.",f:"3x per week"},b:["Cleans the bloodstream — Dr.Fire's primary blood herb","Significantly lowers high blood pressure","Lowers LDL (bad) cholesterol","Extremely high in Vitamin C","Powerful antioxidant — anti-ageing","Natural diuretic — reduces water retention"],u:"Dr.Fire method: do NOT boil. Place dried petals in cold or warm water and allow to infuse for several hours or overnight. Drink 3x a week.",i:"Sorrel — deeply rooted in African and Ital tradition. Red like life itself. The blood is the river of the body — keep it clean.",ca:"May lower blood pressure significantly — monitor if on BP medication. Avoid in pregnancy."},
{n:"Lavender",e:"",c:"calm",col:"#7b5ea7",t:"The Peace Herb",b:["Powerful anxiety and stress reducer","Promotes deep restorative sleep","Antidepressant — lifts mood naturally","Relieves headaches and migraines","Anti-inflammatory and antimicrobial","Balances the nervous system"],u:"1 tsp of flowers per cup, steep 5 minutes. Blend with chamomile for a potent sleep tea.",i:"Brings the spirit into alignment — calms the overactive mind so Jah's inner guidance can be heard.",ca:"Excessive use may cause drowsiness. Avoid if pregnant without guidance."},
{n:"Peppermint",e:"",c:"digestive",col:"#1a7a4a",t:"The Digestive Warrior",b:["Powerful relief for IBS, bloating and gas","Antispasmodic — relaxes intestinal muscles","Clears sinuses and respiratory congestion","Natural pain relief for tension headaches","Antimicrobial properties","Refreshes and energises without caffeine"],u:"Steep 1-2 tsp fresh or dried leaves for 5-7 minutes. Drink after meals for digestion. Inhale steam for sinus relief.",i:"Clean, vital and alive — mint speaks to the freshness that Ital living cultivates in every part of life.",ca:"Avoid in acid reflux. Not recommended for infants."},
{n:"Damiana",e:"",c:"spirit",col:"#8b6914",t:"The Spirit Lifter",sebi:true,b:["Traditional aphrodisiac — supports libido naturally","Antidepressant and mood-elevating","Reduces anxiety and emotional exhaustion","Supports the adrenal and reproductive systems","Historically used for spiritual and visionary practices","Hormonal balancing — beneficial for both men and women"],u:"Steep 1 tsp in boiling water for 10 minutes. Blend with rose petals and cinnamon for a warming tonic.",i:"Used by the Maya and carried forward in Ital practice — reconnects you to your vital life force.",ca:"Avoid in pregnancy. High doses may have mild psychoactive effects — use with intention."},
{n:"Mullein",e:"",c:"respiratory",col:"#5a7a3a",t:"The Lung Cleanser",sebi:true,fire:{role:"Liver - Eyes - Legs",p:"Dr.Fire uses mullein to clear the liver, support eye health and improve circulation in the legs alongside its lung-clearing work.",f:"2-3x daily during cleanse cycles"},b:["Premier herb for lung health — expectorant clears mucus","Soothes bronchitis, asthma and chest tightness","Supports recovery from smoking damage","Antimicrobial — fights respiratory infections","Soothes sore throats"],u:"Steep 1-2 tsp dried leaf for 10-15 minutes. Strain well. Drink 2-3 cups daily.",i:"Jah breathed life into man — mullein keeps that breath clean, clear and free.",ca:"Strain thoroughly to remove fine hairs. Avoid if allergic to Scrophulariaceae plant family."},
{n:"Roasted Green Tea",e:"",c:"healing",col:"#6b7c3a",t:"The Grounding Brew",b:["Lower caffeine — gentle sustained energy","Rich in antioxidants (catechins)","Supports metabolism and healthy weight","Calming L-theanine reduces stress while maintaining focus","Supports heart and liver health","Earthy, nutty flavour from the roasting process"],u:"Steep at 80C (not boiling) for 1-2 minutes. Can be steeped multiple times. Drink in the morning or afternoon.",i:"The roasting transforms — a reminder that fire purifies. Simple, grounding, medicinal.",ca:"Contains caffeine — avoid in the evening. Not recommended for those with iron deficiency (drink between meals)."},
{n:"Thai Tea",e:"",c:"healing",col:"#c17f3a",t:"The Golden Energiser",b:["Rich in antioxidants — fights free radicals","Natural energy boost from black tea base","Contains spices like star anise — aids digestion","Anti-inflammatory properties","Supports immune health"],u:"Brew strong with boiling water for 5 minutes. For Ital use: oat milk or coconut milk. Best in the morning.",i:"The spice blend honours the connection between Eastern herbal wisdom and Ital wholeness.",ca:"Contains caffeine — avoid late in the evening."},
{n:"Neem Leaf",e:"",c:"digestive",col:"#3d6b2a",t:"The Colon Cleanser",fire:{role:"The Colon (The Toilet)",p:"Dr.Fire's colon cleanser. The colon is the body's toilet — neem clears it. Toxins mobilised from the blood by sorrel are pushed to the liver and kidneys, then neem escorts them out.",f:"1x per week only"},b:["Clears the colon — the body's primary waste exit","Toxins pushed to liver and kidney are escorted out","Powerful antimicrobial — kills harmful bacteria and parasites","Antifungal — addresses candida and gut overgrowth","Supports the lymphatic system"],u:"Steep 5-7 dried leaves for 10 minutes. Very bitter — start small. Drink on an empty stomach. Dr.Fire: 1x per week only.",i:"Neem is the great sweeper — it clears the path so all other healing can move freely through the body.",ca:"Very potent — 1x per week only per Dr.Fire protocol. Do not use for extended periods. Avoid in pregnancy."},
{n:"Alfalfa",e:"",c:"kidney",col:"#4a8c3a",t:"The Mineral Builder",b:["Exceptional diuretic — flushes kidneys naturally","Rich in chlorophyll, minerals and vitamins K, C, B","Alkalises the body — supports kidney stone prevention","Anti-inflammatory for urinary tract","Supports bone density","Detoxifies and rebuilds the blood"],u:"Steep 1-2 tsp in boiling water for 5-7 minutes. Blend with dandelion for a kidney cleanse tea. Drink 2 cups daily.",i:"Deep roots that pull minerals from the earth — alfalfa gives us what the soil carries. True Ital nourishment.",ca:"Avoid with autoimmune conditions (lupus). Contains Vitamin K — interacts with blood thinners."},
{n:"Dandelion",e:"",c:"kidney",col:"#c4a000",t:"The Kidney Tonic",sebi:true,fire:{role:"The Kidney",p:"Pairs with Milk Thistle as the kidney cleanse duo in the Dr.Fire protocol. Together they pull waste from the kidney as toxins pass through from the blood and colon cleanse.",f:"Daily — pair with Milk Thistle"},b:["Premier kidney tonic and diuretic herb","Supports liver detoxification","Rich in potassium — replenishes what diuretics remove","Anti-inflammatory for urinary tract","Supports healthy blood pressure","Prebiotic — feeds beneficial gut bacteria"],u:"Steep 1-2 tsp dried root or leaf in boiling water for 10 minutes. Roasted dandelion root makes a rich coffee-like brew. Drink 2-3 cups daily.",i:"The weed Babylon calls a nuisance — Ital wisdom knows it as medicine. What the world discards, we use to heal.",ca:"May increase frequency of urination. Avoid if allergic to ragweed family."},
{n:"Milk Thistle",e:"",c:"liver",col:"#9b59b6",t:"The Liver Shield",fire:{role:"The Liver",p:"Shields and regenerates the liver as toxins are pushed through during the Dr.Fire cleanse. Works with mullein to keep the liver processing cleanly.",f:"Daily during cleanse cycles"},b:["Protects and regenerates liver cells — silymarin is liver-specific medicine","Reduces liver inflammation and scarring","Powerful antioxidant in liver tissue","Helps the body process and eliminate toxins efficiently","Supports healthy cholesterol levels","Indirectly eases kidney load by keeping the liver clean"],u:"Steep 1 tsp crushed seeds or dried herb for 10-15 minutes. Drink 1-2 cups daily. During a cleanse: use daily to shield the liver as toxins pass through.",i:"The liver is the alchemist of the body — it transforms everything that enters. Milk thistle protects that sacred work.",ca:"Generally very safe. Avoid high doses in pregnancy. May lower blood sugar — monitor if diabetic."},
{n:"Burdock Root",e:"",c:"drsebi",col:"#8B4513",t:"The #1 Blood Cleanser",sebi:true,b:["Dr. Sebi's #1 blood cleanser — removes heavy metals and deep systemic toxins","Powerful diuretic — flushes kidneys and lymphatic system","Rich in organic iron — rebuilds and strengthens the blood","Anti-inflammatory — reduces joint and tissue inflammation","Prebiotic — feeds beneficial gut bacteria","Supports healthy clear skin from within"],u:"Steep 1 tsp dried root in boiling water for 15 minutes. Strong earthy flavour. Drink 1-2 cups daily. Pairs well with dandelion root.",i:"The root that goes deepest into the earth carries the deepest medicine. Burdock pulls what no other herb can reach.",ca:"Avoid in pregnancy. May interact with blood thinners or diabetes medication."},
{n:"Sarsaparilla",e:"",c:"drsebi",col:"#6B4226",t:"The Endotoxin Binder",sebi:true,b:["Binds to endotoxins in the gut — removes them before blood absorption","Powerful blood purifier used for skin disease and systemic toxicity","Anti-inflammatory — used for arthritis and deep joint pain","Contains organic iron and zinc in plant-available form","Supports testosterone and reproductive hormones naturally","Diuretic — flushes the kidneys"],u:"Steep 1 tsp dried root for 10-15 minutes. Bitter and earthy. Drink 1 cup daily. Best combined with burdock root as a blood cleanse tea.",i:"Sarsaparilla binds what poisons the blood and removes it — a guardian at the gate of the body's purity.",ca:"Avoid large amounts in pregnancy. May increase absorption of some medications — space them 2 hours apart."},
{n:"Blue Vervain",e:"",c:"drsebi",col:"#4169a0",t:"The Nervous System Healer",sebi:true,b:["Dr. Sebi's primary herb for the nervous system","Relieves tension, anxiety and emotional stress held in the body","Antispasmodic — relieves muscle tension and cramps","Supports liver and lymphatic drainage","Helps with insomnia rooted in mental overactivity","Mild expectorant — clears mucus from the respiratory tract"],u:"Steep 1 tsp dried herb for 10 minutes. Bitter — sweeten with agave or date syrup. Drink 1 cup in the evening or during stress.",i:"The mind holds what the body carries. Blue vervain releases the tension that the spirit has been storing for too long.",ca:"Avoid in pregnancy — can stimulate uterine contractions. Do not combine with blood pressure medication without guidance."},
{n:"Sea Moss (Herb Board)",e:"",c:"drsebi",col:"#2E8B57",t:"The 92-Mineral Foundation",sebi:true,b:["Contains 92 of the 102 minerals the human body is made of","Dr. Sebi's foundational supplement — taken daily","Supports thyroid function — rich in natural iodine","Strengthens gut lining — powerful prebiotic","Boosts immunity, energy and skin health","Anti-inflammatory — supports joints and respiratory health"],u:"Soak dried sea moss 12-24 hours, blend with spring water to make a gel. Take 1-2 tbsp daily in smoothies or teas. Source wildcrafted sea moss only.",i:"The ocean is the original womb of life — sea moss carries the mineral memory of where we all came from.",ca:"High in iodine — avoid if you have hyperthyroidism. Source wildcrafted from clean waters only."},
{n:"Bladderwrack",e:"",c:"drsebi",col:"#3d7a5a",t:"The Thyroid Herb",sebi:true,b:["Pairs with sea moss as Dr. Sebi's ocean mineral duo","Rich in natural iodine — supports thyroid health directly","Anti-inflammatory — reduces joint swelling","Supports healthy metabolism and weight regulation","Antioxidant — protects cells from oxidative stress","Traditionally used for goitre and thyroid imbalance"],u:"Steep 1 tsp dried flakes for 10 minutes. Salty oceanic flavour. Or blend into the sea moss gel. Drink 1 cup daily alongside sea moss.",i:"From the deep waters Jah made — bladderwrack carries the minerals of the ancient sea, restoring what modern food has stripped from us.",ca:"High in iodine — do not use if you have hyperthyroidism or are on thyroid medication without guidance."},
{n:"Tila (Linden Flower)",e:"",c:"drsebi",col:"#b5a030",t:"The Mucus Membrane Soother",sebi:true,b:["Dr. Sebi's herb for calming and mucus membrane healing","Antispasmodic — relieves nervous tension and anxiety","Clears mucus from the respiratory tract gently","Anti-inflammatory for the digestive tract","Promotes restful sleep without heavy sedation","Supports healthy blood pressure"],u:"Steep 1-2 tsp dried flowers for 10 minutes. Light sweet honey-like flavour. Drink 1-2 cups daily.",i:"Gentle enough for children, powerful enough for deep healing — tila reminds us medicine does not always need to be bitter to work.",ca:"Generally very safe. Avoid excessive daily use over very long periods without breaks."},
{n:"Nopal Cactus",e:"",c:"drsebi",col:"#5a8c3a",t:"The Blood Sugar Balancer",sebi:true,b:["Dr. Sebi's approved herb for blood sugar regulation","Regulates blood sugar — reduces glucose absorption in the gut","Anti-inflammatory — reduces systemic inflammation","Rich in organic iron, calcium and antioxidants","Reduces LDL cholesterol naturally","Alkaline-forming in the body — aligns with the African Bio-Mineral Balance"],u:"Juice or blend fresh nopal pads. As dried powder steep 1 tsp in hot water for 10 minutes. Drink 1 cup before meals.",i:"The cactus survives where nothing else can — it teaches the body to regulate itself even in the harshest conditions.",ca:"May lower blood sugar significantly — monitor closely if diabetic or on medication. Introduce gradually."}
];
var herbCats={all:{l:"All",col:"#8a7a5a"},drfire:{l:"Dr.Fire",col:"#2E8B57"},drsebi:{l:"Dr. Sebi",col:"#2E8B57"},cancer:{l:"Cancer Fighting",col:"#7a3a2a"},healing:{l:"Deep Healing",col:"#2d5a27"},calm:{l:"Calm & Sleep",col:"#7b5ea7"},liver:{l:"Liver",col:"#9b59b6"},woman:{l:"Womb Health",col:"#8b3a52"},heart:{l:"Heart & Blood",col:"#b5294e"},digestive:{l:"Digestive",col:"#1a7a4a"},kidney:{l:"Kidney",col:"#4a8c3a"},spirit:{l:"Spirit",col:"#8b6914"},respiratory:{l:"Respiratory",col:"#5a7a3a"}};

var oils=[
{n:"Lavender Oil",e:"",c:"calm",col:"#7b5ea7",t:"The Universal Healer",method:"Diffuse - Topical - Bath",b:["Reduces anxiety and stress — most studied oil for calming the nervous system","Promotes deep restorative sleep","Antiseptic and anti-inflammatory — speeds healing of burns, cuts and bites","Relieves headaches and migraines when applied to temples","Antidepressant — lifts mood naturally","Safe for children when diluted"],u:"Diffuse 4-6 drops. Apply 2-3 drops diluted in coconut or jojoba oil to pulse points. Add 5-10 drops to a warm bath.",i:"One of the few essential oils generally safe to apply neat in small amounts. Always dilute for children.",ca:"Avoid during first trimester of pregnancy."},
{n:"Tea Tree Oil",e:"",c:"healing",col:"#2d5a4a",t:"Nature's Antiseptic",method:"Topical - Diffuse - Cleaning",b:["Powerful antibacterial — effective against many strains including MRSA","Antifungal — treats nail fungus, athlete's foot and thrush","Antiviral properties — supports immunity","Treats acne — reduces bacteria and inflammation","Soothes scalp conditions — dandruff, dry scalp","Natural household disinfectant"],u:"Skin: dilute 1-2 drops in a carrier oil. Scalp: add 5 drops to shampoo. Diffuse for air purification.",i:"One of the most versatile oils in any apothecary. A true staple.",ca:"NEVER ingest — toxic when swallowed. Always dilute. Keep away from pets especially cats."},
{n:"Frankincense Oil",e:"",c:"spirit",col:"#c8a040",t:"The Sacred Oil",method:"Diffuse - Topical - Meditation",b:["Deepens meditation — activates ion channels in the brain associated with calm","Anti-tumour properties — researched for brain and breast cancer","Reduces anxiety and depression","Anti-inflammatory — supports joints and arthritis","Skin rejuvenating — reduces scars and signs of ageing","Grounding and centering — anchors scattered energy"],u:"Diffuse during meditation or before sleep. Dilute 2-3 drops in jojoba or rosehip oil and apply to skin or behind ears.",i:"Burned in temples for thousands of years across Africa, the Middle East and India. If one oil belongs in every sacred space it is this one.",ca:"Avoid during pregnancy. May interact with blood thinners. Do not ingest the essential oil."},
{n:"Peppermint Oil",e:"",c:"digestive",col:"#1a7a4a",t:"The Cool Healer",method:"Diffuse - Topical - Inhale",b:["Relieves headaches and migraines when applied to temples","Energising and focus-enhancing — natural alternative to caffeine","Soothes digestive discomfort, nausea and IBS","Clears sinuses and respiratory congestion","Cooling pain relief for muscles and joints","Natural insect repellent"],u:"Headaches: dilute and apply to temples and back of neck. Diffuse for energy and focus. Inhale directly for nausea.",i:"Keep a bottle in your bag. One of the most immediately useful oils day to day.",ca:"Do not apply undiluted near eyes or children's faces. Avoid if you have acid reflux."},
{n:"Eucalyptus Oil",e:"",c:"respiratory",col:"#5a7a3a",t:"The Lung Opener",method:"Diffuse - Steam - Topical",b:["Opens airways and clears respiratory congestion — colds, flu, bronchitis","Antibacterial and antiviral — purifies air when diffused","Relieves muscle pain and tension","Stimulates immune function","Cooling and refreshing — reduces fever","Improves focus and mental clarity"],u:"Add 3-5 drops to a bowl of hot water, cover head with towel and inhale. Diffuse during illness. Dilute and apply to chest.",i:"The classic sick-day oil.",ca:"Never ingest. Keep away from children under 2."},
{n:"Rose Oil",e:"",c:"woman",col:"#8b3a52",t:"The Heart Opener",method:"Diffuse - Topical - Bath",b:["Deeply supportive for grief, heartbreak and emotional pain","Balances hormones — supports menstrual regulation","One of the highest vibrational essential oils","Aphrodisiac — supports libido and intimacy","Anti-inflammatory and antibacterial for skin","Reduces anxiety and lifts depression"],u:"Diffuse for emotional healing. Dilute in rosehip oil and apply to heart centre. Add 3-4 drops to bath with Epsom salts.",i:"It takes approximately 60 roses to make one drop of pure rose essential oil. Buy from a trusted source.",ca:"Avoid during pregnancy. Ensure you buy genuine rose otto — many products are adulterated with synthetic fragrance."},
{n:"Coconut Oil",e:"",c:"healing",col:"#c8b060",t:"The All-Purpose Fat",ital:true,sebi:true,method:"Cooking - Topical - Oil Pulling",b:["Lauric acid — antimicrobial, antifungal and antiviral at a cellular level","MCT (medium chain triglycerides) — immediate energy without digestion","The Ital replacement for butter and all dairy fats","Stable at high heat — one of the safest cooking fats","Deeply moisturising for skin and hair","Supports gut health — antimicrobial against harmful bacteria"],u:"Cooking: use for medium-to-high heat. Skin: apply directly as moisturiser or hair mask. Oil pulling: 1 tbsp swished for 15-20 minutes. Always buy raw, cold-pressed, virgin coconut oil.",i:"In Ital living, coconut replaces all animal fats. The milk of the earth, not the animal.",ca:"High in saturated fat — use in moderation if managing cardiovascular disease. Buy raw cold-pressed virgin only."}

var plants=[
{n:"Ganja (Cannabis)",e:"",c:"sacred",col:"#2d5a27",t:"The Sacrament",trad:"Rastafarian - Vedic - Indigenous",b:["Sacred sacrament in Rastafari — used for meditation, prayer and reasoning","Referenced in the Vedas as one of five sacred plants","Pain relief and anti-inflammatory — medical cannabis well established","Reduces anxiety, PTSD and depression","Supports sleep and nervous system regulation","Anti-nausea — used during chemotherapy"],u:"Ceremonial: smoked with intention, in community or in meditation. Medicinal: CBD oil, tinctures, edibles — start low and slow.",i:"This plant has been criminalised to oppress the communities that hold it sacred. Know the history. Use with respect.",ca:"Legal status varies by country. Not recommended for those with personal or family history of psychosis. Avoid during pregnancy."},
{n:"Ceremonial Cacao",e:"",c:"heart",col:"#5a2d1a",t:"The Heart Opener",trad:"Mayan - Aztec - Central American",b:["Opens the heart centre — used ceremonially for emotional healing and connection","Contains theobromine — a gentle sustained energy lift without the anxiety of caffeine","MAO inhibitor — enhances mood and sense of wellbeing","Rich in magnesium, iron and antioxidants","Facilitates emotional release and deep inner work","Enhances creativity, presence and empathy"],u:"Ceremonial dose: 40-42g cacao block melted in hot water with chilli, cinnamon and a little sweetener. Set an intention. Sit with it.",i:"Not the same as chocolate. Ceremonial cacao is minimally processed, full-fat and used with intention. Source ethically — Guatemalan or Peruvian origin.",ca:"Avoid if on antidepressants (MAOIs) without guidance. High doses can cause nausea or racing heart in sensitive people."},
{n:"Psilocybin Mushrooms",e:"",c:"vision",col:"#6a4a8a",t:"The Great Teacher",trad:"Mazatec - Mesoamerican - Global Indigenous",b:["Clinically proven to reduce treatment-resistant depression — Johns Hopkins and Imperial College research","Dissolves ego defensiveness — allows deep trauma processing","Reduces end-of-life anxiety in terminal patients","Creates lasting personality changes toward openness and empathy","Shown to reduce addiction — smoking, alcohol, opioids","Mystical experiences with long-term positive wellbeing impact"],u:"Set and setting are everything. Micro-dosing: 0.1-0.3g for subtle cognitive and mood benefits. Ceremonial dose: 2-3.5g in a safe intentional space. Never alone for high doses. Integration after is as important as the journey.",i:"This medicine is having a clinical renaissance. What indigenous communities have known for millennia, science is now confirming.",ca:"Illegal in most countries — know your jurisdiction. Not suitable for those with personal or family history of psychosis or schizophrenia. Avoid mixing with lithium or SSRIs without guidance."},
{n:"Kambo",e:"",c:"vision",col:"#5a7a2a",t:"The Jungle Vaccine",trad:"Amazonian Indigenous - Matses - Kaxinawa",b:["Secretion from the giant monkey frog — used by Amazonian tribes for centuries","Powerful purgative — deeply cleanses the body and lymphatic system","Anti-inflammatory peptides — some of the most potent in nature","Reported to reduce depression and trauma when used ceremonially","Antimicrobial properties — used traditionally before hunting for endurance","Peptides cross the blood-brain barrier — affecting mood, energy and clarity"],u:"Applied by burning small points on the skin and placing the secretion on the burns. MUST be done by a trained practitioner — never attempt alone. Fast beforehand. Set clear intention.",i:"The Matses people call it hunting medicine. It does not ease you in — it purges what is held and leaves you clear. A medicine of the deep jungle and of deep courage.",ca:"Serious risk of death if used improperly — must only be used with a certified practitioner. Contraindicated with heart conditions, mental health medication, pregnancy, low blood pressure. Research your practitioner thoroughly."},
{n:"Rapeh (Hapeh)",e:"",c:"sacred",col:"#7a5a3a",t:"The Sacred Snuff",trad:"Amazonian Indigenous - Yawanapi - Huni Kuin",b:["Sacred tobacco snuff used by many Amazonian tribes — not recreational","Ground from mapacho (wild tobacco) and sacred plant ash","Grounds and centres the mind — clears mental fog and anxiety rapidly","Used before ceremony to set intention and clear the energy field","Antimicrobial — the ash alkalises and cleanses the nasal passages","Connects to the ancestral plant medicine lineage of the Amazon"],u:"Self-administering is possible with a kuripe pipe (V-shaped pipe from mouth to own nostril). Requires strong intention and a quiet setting. Start with a very small amount. Sit with it — do not resist what arises.",i:"This is not tobacco as Babylon uses it. Rapeh is a sacred tool, held in ceremony and given as medicine. The tradition asks that you approach it with the reverence it deserves.",ca:"Contains nicotine — avoid if you have heart conditions or blood pressure issues. Not suitable during pregnancy. Do not use for recreation — it is a ceremonial medicine. Source from ethical indigenous suppliers only."},
{n:"Sananga Eye Drops",e:"",c:"vision",col:"#3a6a8a",t:"The Vision Cleanser",trad:"Amazonian Indigenous - Matses - Yawanapi",b:["Made from the root bark of Tabernaemontana undulata — an Amazonian shrub","Used by hunters to sharpen physical and spiritual vision","Reported to clear energetic blockages and emotional debris","Anti-inflammatory for the eyes — used traditionally to treat eye conditions","Used to prepare the mind and energy field before ayahuasca or other ceremonies","Reported to enhance colour perception and visual clarity after use"],u:"Applied directly to the eyes — 1 drop per eye. Burns intensely for 5-10 minutes. Lie down, breathe through it, do not rub the eyes. The burning is the medicine doing its work.",i:"The Matsés say it clears what the eye cannot see — meaning what the spirit carries. The burning is the release. What comes after is clarity.",ca:"Buy only pharmaceutical-grade sananga from ethical sources. The burn is intense but temporary — it is not damaging if properly prepared. Avoid if you have active eye infections or recent eye surgery."}
];
